  function destsText(d) { return d.map(([z, p]) => Array.isArray(z) ? `[${z[0]} ${z[1]}] ${p ?? '-'}` : `${z} ${p ?? '-'}`).join(', '); }
  // ---------- mini-campo grafico / graphical mini-court ----------
  // stessa geometria di foglio_panchina.py (mini): il nostro campo, rete in alto / same geometry as the script: our court, net on top
  const MCOL = { 4: 0, 7: 0, 5: 0, 3: 1, 8: 1, 6: 1, 2: 2, 9: 2, 1: 2 }, MROW = { 4: 0, 3: 0, 2: 0, 7: 1, 8: 1, 9: 1, 5: 2, 6: 2, 1: 2 };
  const SIDEX = { l: .12, c: .5, r: .88 }, STARTS = [['l', .12], ['0.3', .3], ['c', .5], ['0.7', .7], ['r', .88]];
  function miniPad(mi, gi, g) {
    const X0 = 14, Y0 = 22, W = 113, H = 66, cw = W / 3, ch = H / 3;
    const fx = typeof g.x === 'string' ? SIDEX[g.x] : +g.x, sx = X0 + W * fx;
    const on = new Map(g.dests.filter(d => !Array.isArray(d[0])).map(d => [String(d[0]), d[1]]));
    const at = `data-mi="${mi}" data-gi="${gi}"`;
    let h = `<svg class="pad" viewBox="0 0 141 ${Y0 + H + 4}" role="img">`;
    for (const z of ['4', '3', '2', '7', '8', '9', '5', '6', '1']) {
      const x = X0 + MCOL[z] * cw, y = Y0 + MROW[z] * ch, sel = on.has(z);
      h += `<rect class="pz${sel ? ' on' : ''}" x="${x}" y="${y}" width="${cw}" height="${ch}" data-a="padZone" data-z="${z}" ${at}></rect>` +
        `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" text-anchor="middle" class="pzt">${z}</text>`;
    }
    h += `<line x1="${X0 - 6}" y1="${Y0}" x2="${X0 + W + 6}" y2="${Y0}" class="pnet"></line>`;
    for (const z of on.keys()) {
      const cx = X0 + (MCOL[z] + .5) * cw, cy = Y0 + (MROW[z] + .5) * ch;
      h += `<line x1="${sx}" y1="${Y0 - 3}" x2="${cx}" y2="${cy - 6}" class="parr"></line><circle cx="${cx}" cy="${cy - 6}" r="2.2" class="parh"></circle>`;
    }
    for (const [v, f] of STARTS) {
      const x = X0 + W * f, cur = STARTS.reduce((b, q) => Math.abs(q[1] - fx) < Math.abs(b[1] - fx) ? q : b)[1] === f;   // il punto più vicino / the nearest point
      h += `<circle class="pst${cur ? ' on' : ''}" cx="${x}" cy="${Y0 - 10}" r="${cur ? 6 : 5}" data-a="padStart" data-v="${v}" ${at}></circle>`;
    }
    h += '</svg>';
    // percentuali degli arrivi / target percentages
    h += '<div class="pdl">' + g.dests.map((d, k) => {
      const lab = Array.isArray(d[0]) ? escH(t('padFree')) : 'Z' + escH(d[0]);
      return `<span class="pd"><b>${lab}</b><input data-k="minis.${mi}.groups.${gi}.dests.${k}.1" data-s="1" value="${d[1] ?? ''}" inputmode="numeric" size="3" placeholder="%">` +
        `<button type="button" data-a="padDel" data-k="${k}" ${at} aria-label="✕">✕</button></span>`;
    }).join('') + '</div>';
    return h;
  }
  function parseDests(s) {
    const out = [];
    for (const part of s.split(',').map(x => x.trim()).filter(Boolean)) {
      let m = part.match(/^\[\s*([\d.]+)\s+([\d.]+)\s*\]\s+(-|\d+)$/);
      if (m) { out.push([[+m[1], +m[2]], m[3] === '-' ? null : +m[3]]); continue; }
      m = part.match(/^([1-9])\s+(-|\d+)$/);
      if (!m) throw new Error(part);
      out.push([m[1], m[2] === '-' ? null : +m[2]]);
    }
    return out;
  }

  // scrive un valore seguendo il percorso "a.b.0.c" (undefined = cancella) / writes a value along a dotted path (undefined = delete)
  function setPath(obj, path, val) {
    const ks = path.split('.'); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) {
      const k = ks[i];
      if (o[k] === undefined || o[k] === null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[k];
    }
    const last = ks[ks.length - 1];
    if (val === undefined) delete o[last]; else o[last] = val;
  }
  function convert(key, el) {
    if (el.type === 'checkbox') return el.checked || undefined;
    const v = el.value;
    if (/^so\.\d$/.test(key) || /\.(start|span|font)$/.test(key)) { const n = parseInt(v, 10); if (isNaN(n)) throw new Error(v); return n; }
    if (/^so_class\./.test(key)) return v || undefined;
    if (key === 'serve_alt') return v || null;
    if (/^grid\.\d$/.test(key)) return /^\d+$/.test(v.trim()) ? +v.trim() : v.trim();
    if (key === 'notes' || /\.sub$/.test(key)) return v.split('\n').map(x => x.trim()).filter(Boolean);
    if (key === 'nb') return v.trim() || undefined;
    if (/\.dests$/.test(key)) return parseDests(v);
    if (/\.dests\.\d+\.1$/.test(key)) { const x = v.trim(); if (x === '' || x === '-') return null; const n = parseInt(x, 10); if (isNaN(n) || n < 0 || n > 100) throw new Error(v); return n; }
    if (/\.setter_x$/.test(key)) { if (v.trim() === '') return undefined; const n = parseFloat(v.replace(',', '.')); if (isNaN(n)) throw new Error(v); return clamp(n, 0, 1); }
    if (/\.groups\.\d+\.x$/.test(key)) { const s = v.trim(); if (['l', 'c', 'r'].includes(s)) return s; const n = parseFloat(s.replace(',', '.')); if (isNaN(n)) throw new Error(v); return clamp(n, 0, 1); }
    if (/^minis\.\d+\.label$/.test(key)) return v.trim() === '' ? null : v;
    if (/\.label$/.test(key) || /\.3\.note$/.test(key)) return v.trim() === '' ? undefined : v;
    if (/^block\.\d+\.2$/.test(key)) return +v;
    return v;
  }
  function onField(ev) {
    const el = ev.target, key = el.dataset.k;
    if (!key || key.startsWith('_')) return;
    let val;
    try { val = convert(key, el); el.classList.remove('bad'); } catch (e) { el.classList.add('bad'); $('#status').textContent = `${t('bad')}: ${e.message}`; return; }
    snapshot();
    const shared = el.dataset.s === '1', top = key.startsWith('$'), path = key.replace(/^\$/, '');
    (shared ? langs() : [st.lang]).forEach(l => {
      const base = top ? st.doc[l] : st.doc[l].columns[st.col];
      if (/^block\.\d+\.3\./.test(path)) {   // il quarto elemento del muro esiste solo se serve / block options only when needed
        const b = base.block[+path.split('.')[1]];
        if (b.length < 4) b.push({});
        setPath(base, path, val);
        if (!Object.keys(b[3]).length) b.length = 3;
        return;
      }
      setPath(base, path, val);
    });
    if (path === 'serve_target' || path === 'serve_alt') both(c => { if (c.serve_alt === c.serve_target) c.serve_alt = null; });
    save(); renderCourt(); renderSheet();
    if (el.tagName === 'SELECT' || el.type === 'checkbox') renderInspector();
  }

  // ---------- azioni / actions ----------
  const actions = {
    addPlayer() { snapshot(); both(c => c.players.push(['?', 0.5, 0.5, 'F'])); st.sel = { t: 'player', i: col().players.length - 1 }; commit(); },
    delPlayer() { if (!st.sel || st.sel.t !== 'player') return; snapshot(); const i = st.sel.i; both(c => c.players.splice(i, 1)); st.sel = null; commit(); },
    setStyle(el) { const p = selP(); if (p === null) return; snapshot(); both(c => { c.paths[p].style = el.dataset.v; }); commit(); },
    addPt() {
      const p0 = selP(); if (p0 === null) return;
      if (st.sel.t === 'path') {   // nessun punto scelto: a metà del tratto più lungo / no point chosen: middle of the longest segment
        const pts = col().paths[p0].points; let best = 0, bl = -1;
        for (let i = 0; i + 1 < pts.length; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); if (l > bl) { bl = l; best = i; } }
        st.sel = { t: 'pt', p: p0, k: best };
      }
      snapshot();
      const { p, k } = st.sel, n = col().paths[p].points.length, at = k + 1 < n ? k + 1 : k;
      both(c => { const pts = c.paths[p].points, a = pts[k], b = pts[k + 1] || pts[k - 1]; pts.splice(at, 0, [r2((a[0] + b[0]) / 2), r2((a[1] + b[1]) / 2)]); });
      st.sel = { t: 'pt', p, k: at }; commit();
    },
    delPt() {
      if (!st.sel || st.sel.t !== 'pt') return;
      const { p, k } = st.sel; if (col().paths[p].points.length <= 2) return;
      snapshot(); both(c => c.paths[p].points.splice(k, 1)); st.sel = null; commit();
    },
    delPath() { const p = selP(); if (p === null || st.draft) return; snapshot(); both(c => c.paths.splice(p, 1)); st.sel = null; commit(); },
    dup() {
      const src = parseInt($('[data-k="_dup"]').value, 10); if (isNaN(src)) return; snapshot();
      langs().forEach(l => {
        const cs = st.doc[l].columns, s = cs[src], d = cs[st.col];
        d.players = clone(s.players); d.setter = clone(s.setter); d.paths = clone(s.paths);
        d.block = s.block.map(b => clone(b));
      });
      st.sel = null; commit();
    },
    addMini() { snapshot(); both(c => c.minis.push({ label: null, label_side: 'r', groups: [{ x: 'r', dests: [['1', null]], style: 'main' }] })); commit(); },
    delMini(el) { snapshot(); const mi = +el.dataset.mi; both(c => c.minis.splice(mi, 1)); commit(); },
    padZone(el) {   // tocco su una zona: aggiunge o toglie la freccia / tap a zone: add or remove the arrow
      const mi = +el.dataset.mi, gi = +el.dataset.gi, z = el.dataset.z; snapshot();
      both(c => { const d = c.minis[mi].groups[gi].dests, i = d.findIndex(q => !Array.isArray(q[0]) && String(q[0]) === z); if (i >= 0) d.splice(i, 1); else d.push([z, null]); });
      commit();
    },
    padStart(el) { const mi = +el.dataset.mi, gi = +el.dataset.gi, v = el.dataset.v; snapshot(); both(c => { c.minis[mi].groups[gi].x = /^[lcr]$/.test(v) ? v : +v; }); commit(); },
    padDel(el) { const mi = +el.dataset.mi, gi = +el.dataset.gi, k = +el.dataset.k; snapshot(); both(c => c.minis[mi].groups[gi].dests.splice(k, 1)); commit(); },
    delGroup(el) { const mi = +el.dataset.mi, gi = +el.dataset.gi; if (st.doc[st.lang].columns[st.col].minis[mi].groups.length < 2) return; snapshot(); both(c => c.minis[mi].groups.splice(gi, 1)); commit(); },
    addGroup(el) { snapshot(); const mi = +el.dataset.mi; both(c => c.minis[mi].groups.push({ x: 'l', dests: [['5', null]], style: 'alt' })); commit(); },
    addSpan() { snapshot(); langs().forEach(l => { const c = st.doc[l]; (c.note_spans = c.note_spans || []).push({ start: st.col + 1, span: 1, text: '…' }); }); commit(); },
    delSpan(el) { snapshot(); const i = +el.dataset.i; langs().forEach(l => st.doc[l].note_spans.splice(i, 1)); commit(); },
    addBox() { snapshot(); langs().forEach(l => { const c = st.doc[l]; (c.extra_boxes = c.extra_boxes || []).push({ start: st.col + 1, span: 1, text: '…' }); }); commit(); },
    delBox(el) { snapshot(); const i = +el.dataset.i; langs().forEach(l => st.doc[l].extra_boxes.splice(i, 1)); commit(); }
  };

  // ---------- campo: trascinare, toccare, disegnare / court: drag, tap, draw ----------
  function toCourt(ev) {
    const svg = $('#court svg'), r = svg.getBoundingClientRect(), g = S2B.geom, sc = r.width / g.CW;
    const ux = (ev.clientX - r.left) / sc, uy = (ev.clientY - r.top) / sc;

      const r = col.name.replace(/\D/g, ''), x = d.cols[r]; if (!x) continue;

      const mg = (col.grid || []).map(String), zone = {};

  async function create() {

      // stesso ordine degli script da riga di comando (file in ordine di nome): a parità di valori decide l'ordine

      const paths = py.toPy(selected().slice().sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0).map(m => m.path)), us = $('#dvwus').value.trim(), w = parseFloat($('#dvwweight').value) || 3;

        const os = { true: d.start_recv || d.start_rot, false: d.start_serve || d.start_rot }, n = parseInt($('#dvwnsets').value, 10), best = {};

            if (!top || p > top[0]) top = [p, a];

        const dt = k => new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100);
        const md = new Date(dt(last).getTime() + 86400000), days = Math.round((md - dt(first)) / 86400000) + 1;
        const p2 = n => String(n).padStart(2, '0');
        let noi = null; try { noi = JSON.parse(localStorage.getItem('s2b:noi')); } catch (e) { }
        // nostra squadra: ultimi valori salvati sul dispositivo, altrimenti il game plan Lemesos (versione privata) o valori da completare
        // our team: last values saved on the device, else the Lemesos game plan (private build) or values to fill in
        const base = noi || (models.lemesos && models.lemesos.gameplan) || { our_lineup_p1: [1, 2, 3, 4, 5, 6], our_names: {}, our_roles: {} };
        const g = d.cols['1'] && d.cols['1'].grid;   // griglia R1 = z1 z6 z5 / z2 z3 z4 -> P1..P6
        const nm = name.charAt(0) + name.slice(1).toLowerCase();
        extra.gameplan = { files: sel.map(m => m.info.sig), cfg: {
          id: `GamePlan_${nm.replace(/[^A-Za-z0-9]+/g, '_')}`, opponent: name, match_label: 'Gara ? · gg.mm.aaaa', match_label_en: 'Match ? · DD MON YYYY',
          team: key(), setter, us, weight: w, match_date: `${p2(md.getDate())}/${p2(md.getMonth() + 1)}/${md.getFullYear()}`, window_days: days,
          our_lineup_p1: base.our_lineup_p1, our_names: base.our_names, our_roles: base.our_roles,
          their_lineup_p1: g ? [g[0], g[3], g[4], g[5], g[2], g[1]] : undefined,
          matchup: mu ? { them: mu.or, us: mu.a, we_serve_first: true } : undefined, key_points_en: [], hot_ball_en: '' } };
      }
      E().addDoc(name, it, en, t('done'), extra);
      await prune();
      msg.textContent = ''; show(false);

  // ---------- finestra / window ----------
  function show(on) { $('#dvwov').classList.toggle('open', on); document.body.classList.toggle('ovopen', on); if (on) { labels(); engine().catch(() => { }); } }
  function labels() {
    $$('#dvwov [data-d]').forEach(el => { el.textContent = t(el.dataset.d); });

  function init() {

    $('#dvwclose').onclick = () => show(false);

    $('#dvwteam').oninput = render; $('#dvwus').onchange = () => { teams(); render(); }; $('#dvwweight').onchange = render;
    ['#dvwsetter', '#dvwsetterx', '#dvwlineup', '#dvwmodel', '#dvwkeepus'].forEach(id => $(id).addEventListener('change', saveMeta));
    $('#dvwcreate').onclick = create;
    $('#lang').addEventListener('change', labels);
    labels();
  }
  // DVW caricati, per il game plan (che li rilegge a ogni disegno) / loaded DVW, for the game plan (re-read at every drawing)
  const files = pred => [...S.matches.values()].filter(pred).sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0).map(m => [m.path, m.name, m.info.sig]);
  window.S2B_DVW = { show, sheet, engine, state: S, F3: () => F3, files };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

  async function pageJpeg(d, page, css, W = 794, H = 1123) {

    if (!on) return;
    labels();
    if (!cfg()) { $('#srpanel').innerHTML = `<p>${esc(t('none'))}</p>`; $('#srframe').srcdoc = ''; return; }
    panel(); $('#srmsg').textContent = t('loading'); preview().then(() => { $('#srmsg').textContent = ''; }).catch(e => { $('#srmsg').textContent = String(e.message || e); });
  }
  function labels() {
    $('#srbtn').textContent = t('open');
    $$('#srov [data-s2]').forEach(el => { el.textContent = t(el.dataset.s2); });
    $$('#srov [data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === which));
  }
  function init() {
    $('#srbtn').onclick = () => { $('#menu').open = false; show(true); };
    $('#srclose').onclick = () => show(false);
    $$('#srov [data-w]').forEach(b => b.onclick = () => { which = b.dataset.w; labels(); preview(); });
    $('#srpdf').onclick = download;
    $('#srpanel').addEventListener('change', onField);
    window.addEventListener('resize', fit);
    $('#lang').addEventListener('change', () => { labels(); if ($('#srov').classList.contains('open') && cfg()) panel(); });
    labels();
  }
  window.S2B_REPORT = { show, preview, pdf, pageJpeg };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<script>/*
 * gameplan.js - Game plan (fase 3): pagine disegnate da game_plan.py ORIGINALE (staff IT, staff EN, foglio atlete),
 * modifica delle scelte e dei testi, PDF A4 orizzontale. game_plan.py rilegge i DVW a ogni disegno: servono i DVW
 * salvati sul dispositivo (finestra "Nuovo avversario dai DVW").
 * Game plan (phase 3): pages drawn by the ORIGINAL game_plan.py (staff IT, staff EN, athletes sheet), editing of
 * choices and texts, A4 landscape PDF. game_plan.py re-reads the DVW at every drawing: the DVW saved on the device are needed.
 */
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const E = () => window.S2B_EDITOR, L = () => (E() && E().lang()) || 'it';
  const TX = {
    it: { open: 'Game plan', close: 'Chiudi', sit: 'Staff IT', sen: 'Staff EN', ath: 'Atlete', pdf: 'Scarica PDF', wait: 'Preparo il PDF…', loading: 'Carico il motore e disegno…',
      none: 'Questo avversario non ha un game plan. Crealo con Menu → Nuovo avversario dai DVW (casella "Crea anche il game plan").',
      nodvw: 'Mancano i DVW di questo avversario sul dispositivo: aprili in Menu → Nuovo avversario dai DVW (Aggiungi DVW), poi torna qui.',
      gen: 'Gara', us: 'Noi (AEL)', them: 'Loro', blk: 'Muro: scelta del coach per rotazione', att: 'Attaccanti nei disegni',
      f: { match_label: 'Gara (IT)', match_label_en: 'Gara (EN)', match_date: 'Data della gara (gg/mm/aaaa)', window_days: 'Giorni di gare usati', setter: 'Palleggiatrice n°',
        key_points_en: 'Punti chiave per le atlete, in inglese (max 3, una per riga)', hot_ball_en: 'Palla calda (EN, vuoto = automatica)',
        mu_them: 'Match-up: loro rotazione in ricezione', mu_us: 'nostra rotazione al servizio', mu_first: 'Batte prima', first_us: 'noi', first_them: 'loro',
        our_lineup_p1: 'Nostra formazione z1..z6 (palleggiatrice in z1)', our_names: 'Nostri nomi (es. "3 Rossi, 6 Bianchi")', our_roles: 'Nostri ruoli (es. "3 P, 6 S") P S C O',
        their_lineup_p1: 'Loro formazione z1..z6 (palleggiatrice in z1)', signal: 'Segnale', stext: 'Testo (IT)', stext_en: 'Testo (EN)', auto: 'dai dati',
        show: 'Attaccanti mostrate (numeri, vuoto = prima linea)', side: 'Lato (es. "15 l, 18 r")' },
      lang: 'Pagine staff in italiano o inglese; il foglio atlete esce in inglese (come game_plan.py).' },
    en: { open: 'Game plan', close: 'Close', sit: 'Staff IT', sen: 'Staff EN', ath: 'Athletes', pdf: 'Download PDF', wait: 'Preparing the PDF…', loading: 'Loading the engine and drawing…',
      none: 'This opponent has no game plan. Create it with Menu → New opponent from DVW ("Also create the game plan").',
      nodvw: 'This opponent\'s DVW are not on the device: open them in Menu → New opponent from DVW (Add DVW files), then come back.',
      gen: 'Match', us: 'Us (AEL)', them: 'Them', blk: 'Block: coach\'s choice per rotation', att: 'Attackers in the diagrams',
      f: { match_label: 'Match (IT)', match_label_en: 'Match (EN)', match_date: 'Match date (dd/mm/yyyy)', window_days: 'Days of matches used', setter: 'Setter no.',
        key_points_en: 'Key points for the athletes, in English (max 3, one per line)', hot_ball_en: 'Hot ball (EN, empty = automatic)',
        mu_them: 'Match-up: their rotation receiving', mu_us: 'our rotation serving', mu_first: 'Serves first', first_us: 'us', first_them: 'them',
        our_lineup_p1: 'Our line-up z1..z6 (setter in z1)', our_names: 'Our names (e.g. "3 Smith, 6 Brown")', our_roles: 'Our roles (e.g. "3 P, 6 S") P S C O',
        their_lineup_p1: 'Their line-up z1..z6 (setter in z1)', signal: 'Signal', stext: 'Text (IT)', stext_en: 'Text (EN)', auto: 'from data',
        show: 'Attackers shown (numbers, empty = front row)', side: 'Side (e.g. "15 l, 18 r")' },
      lang: 'Staff pages in Italian or English; the athletes sheet is in English (as game_plan.py).' }
  };
  const t = k => TX[L()][k], tf = k => TX[L()].f[k];
  const ROTS = [1, 6, 5, 4, 3, 2], SIG = [['', '—'], ['PUGNO', 'PUGNO'], ['4', '4'], ['2', '2'], ['LEGGERE', 'LEGGERE']];
  let which = 'it', timer = null;
  const gp = () => E().st.doc.gameplan;

  // ---------- pannello / panel ----------
  const inp = (k, v, attrs = '') => `<label class="f"><span>${esc(tf(k))}</span><input data-g="${k}" value="${esc(v ?? '')}" ${attrs}></label>`;
  const area = (k, v) => `<label class="f"><span>${esc(tf(k))}</span><textarea data-g="${k}" rows="3">${esc(v ?? '')}</textarea></label>`;
  const sel = (k, v, opts) => `<label class="f"><span>${esc(tf(k))}</span><select data-g="${k}">${opts.map(([a, b]) => `<option value="${esc(a)}"${String(v ?? '') === String(a) ? ' selected' : ''}>${esc(b)}</option>`).join('')}</select></label>`;
  const pairs = o => Object.entries(o || {}).map(([k, v]) => `${k} ${v}`).join(', ');
  function panel() {
    const c = gp().cfg, mu = c.matchup || {}, bo = c.block_override || {}, h = [];
    h.push(`<p class="muted">${esc(t('lang'))}</p><details open><summary>${esc(t('gen'))}</summary>`);
    h.push(inp('match_label', c.match_label), inp('match_label_en', c.match_label_en), inp('match_date', c.match_date), inp('window_days', c.window_days, 'inputmode="numeric"'), inp('setter', c.setter, 'inputmode="numeric"'));
    h.push(area('key_points_en', (c.key_points_en || []).join('\n')), inp('hot_ball_en', c.hot_ball_en));
    h.push(sel('mu_them', mu.them ?? '', [['', '—'], ...ROTS.map(r => [r, 'P' + r])]), sel('mu_us', mu.us ?? '', [['', '—'], ...ROTS.map(r => [r, 'P' + r])]),
      sel('mu_first', mu.we_serve_first === false ? 'them' : 'us', [['us', tf('first_us')], ['them', tf('first_them')]]), '</details>');
    h.push(`<details><summary>${esc(t('us'))}</summary>`, inp('our_lineup_p1', (c.our_lineup_p1 || []).join(' ')), inp('our_names', pairs(c.our_names)), inp('our_roles', pairs(c.our_roles)), '</details>');
    h.push(`<details><summary>${esc(t('them'))}</summary>`, inp('their_lineup_p1', (c.their_lineup_p1 || []).join(' ')), '</details>');
    h.push(`<details><summary>${esc(t('blk'))}</summary>`);
    for (const r of ROTS) {
      const o = bo[r] || {};
      h.push(`<div class="rowp"><b>P${r}</b>${sel('blk.' + r + '.signal', o.signal || '', SIG.map(([a, b]) => [a, a ? b : tf('auto')]))}${inp('blk.' + r + '.text', o.text)}${inp('blk.' + r + '.text_en', o.text_en)}</div>`);
    }
    h.push('</details>', `<details><summary>${esc(t('att'))}</summary>`);
    for (const r of ROTS) h.push(`<div class="rowp"><b>P${r}</b>${inp('show.' + r, ((c.attack_show || {})[r] || []).join(' '))}${inp('side.' + r, pairs((c.attack_side || {})[r]))}</div>`);
    h.push('</details>');
    $('#gppanel').innerHTML = h.join('');
    // etichette dei campi per rotazione / per-rotation field labels
    $$('#gppanel [data-g^="blk."]').forEach(el => { el.previousElementSibling.textContent = tf(el.dataset.g.endsWith('signal') ? 'signal' : el.dataset.g.endsWith('_en') ? 'stext_en' : 'stext'); });
    $$('#gppanel [data-g^="show."]').forEach(el => { el.previousElementSibling.textContent = tf('show'); });
    $$('#gppanel [data-g^="side."]').forEach(el => { el.previousElementSibling.textContent = tf('side'); });
  }
  const nums = v => v.split(/[\s,;]+/).filter(Boolean).map(x => +x).filter(x => !isNaN(x));
  const map = (v, f = x => x) => Object.fromEntries(v.split(',').map(x => x.trim().split(/\s+/)).filter(p => p.length === 2 && p[0]).map(([a, b]) => [a, f(b)]));
  function onField(e) {
    const el = e.target, k = el.dataset.g; if (!k) return;
    const c = gp().cfg, v = el.value.trim();
    if (['match_label', 'match_label_en', 'match_date', 'hot_ball_en'].includes(k)) c[k] = v;
    else if (k === 'window_days' || k === 'setter') { const n = parseInt(v, 10); if (isNaN(n)) { el.classList.add('bad'); return; } c[k] = n; }
    else if (k === 'key_points_en') c[k] = el.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 3);
    else if (k.startsWith('mu_')) {
      const m = c.matchup || {}, them = $('[data-g="mu_them"]').value, us = $('[data-g="mu_us"]').value;
      c.matchup = them && us ? { them: +them, us: +us, we_serve_first: $('[data-g="mu_first"]').value === 'us' } : undefined;
      if (!c.matchup) delete c.matchup; void m;
    }
    else if (k === 'our_lineup_p1' || k === 'their_lineup_p1') { const a = nums(v); if (a.length !== 6) { el.classList.add('bad'); return; } c[k] = a; }
    else if (k === 'our_names' || k === 'our_roles') c[k] = map(v);
    else if (k.startsWith('blk.')) {
      const [, r, f] = k.split('.'); c.block_override = c.block_override || {};
      const o = c.block_override[r] = c.block_override[r] || {};
      if (v) o[f] = v; else delete o[f];
      if (!o.signal) delete c.block_override[r];   // senza segnale vale la regola dei dati / without a signal the data rule applies
    }
    else if (k.startsWith('show.')) { const r = k.split('.')[1], a = nums(v); c.attack_show = c.attack_show || {}; if (a.length) c.attack_show[r] = a; else delete c.attack_show[r]; }
    else if (k.startsWith('side.')) { const r = k.split('.')[1], m = map(v); c.attack_side = c.attack_side || {}; if (Object.keys(m).length) c.attack_side[r] = m; else delete c.attack_side[r]; }
    if (/^our_/.test(k)) { try { localStorage.setItem('s2b:noi', JSON.stringify({ our_lineup_p1: c.our_lineup_p1, our_names: c.our_names, our_roles: c.our_roles })); } catch (e) { } }   // ricordati per i prossimi game plan / remembered for the next game plans
    el.classList.remove('bad'); E().save(); clearTimeout(timer); timer = setTimeout(preview, 300);
  }

  // ---------- disegno con game_plan.py / drawing with game_plan.py ----------
  function files() {
    const g = gp(), D = window.S2B_DVW;
    if (g.files) { const want = new Set(g.files); return D.files(m => want.has(m.info.sig)); }
    const k = String(g.cfg.team || '').toUpperCase();   // modello: tutte le gare caricate con quella squadra / model: all loaded matches of that team
    return D.files(m => (m.info.home + ' ' + m.info.away).toUpperCase().includes(k));
  }
  async function preview() {
    if (!gp()) return;
    $('#gpmsg').textContent = t('loading');
    await window.S2B_DVW.engine();
    const fl = files();
    if (!fl.length) { $('#gpmsg').textContent = t('nodvw'); $('#gpframe').srcdoc = ''; return; }
    try {
      const F3 = window.S2B_DVW.F3(), bench = JSON.stringify(E().st.doc.it);
      let html = F3.gp_render(JSON.stringify(gp().cfg), JSON.stringify(fl.map(f => [f[0], f[1]])), bench, which === 'en' ? 'en' : 'it', which === 'ath' ? 'athletes' : 'staff');
      html = html.replace(/<link rel="preconnect"[^>]*><link href="https:\/\/fonts\.googleapis\.com[^>]*>/, `<style>${E().fontcss()}</style>`);
      const fr = $('#gpframe'); fr.srcdoc = html;
      fr.onload = () => { const n = fr.contentDocument.body.children.length; fr.style.height = (n * 794 + 10) + 'px'; fit(); $('#gpmsg').textContent = ''; };
    } catch (e) { $('#gpmsg').textContent = 'Errore / error: ' + String(e.message || e).split('\n').slice(-2).join(' '); }
  }
  function fit() { const box = $('#gpview'), fr = $('#gpframe'), sc = Math.min(1, (box.clientWidth - 4) / 1123); fr.style.transform = `scale(${sc})`; box.style.height = (parseFloat(fr.style.height || 794) * sc) + 'px'; }
  async function download() {
    const b = $('#gppdf'); b.disabled = true; b.textContent = t('wait');
    try {
      const d = $('#gpframe').contentDocument, css = [...d.querySelectorAll('style')].map(s => s.textContent).join('\n'), R = window.S2B_REPORT, out = [];
      for (const p of d.body.children) out.push(await R.pageJpeg(d, p, css, 1123, 794));
      const suf = which === 'ath' ? '_atlete' : which === 'en' ? '_staff_en' : '_staff';
      await E().download(`${gp().cfg.id || 'GamePlan'}${suf}.pdf`, R.pdf(out, 841.89, 595.28), 'application/pdf');
    } catch (e) { $('#gpmsg').textContent = 'PDF: ' + (e.message || e); }
    b.disabled = false; b.textContent = t('pdf');
  }

  // ---------- finestra / window ----------
  function show(on) {
    $('#gpov').classList.toggle('open', on); document.body.classList.toggle('ovopen', on);
    if (!on) return;
    labels();
    if (!gp()) { $('#gppanel').innerHTML = `<p>${esc(t('none'))}</p>`; $('#gpframe').srcdoc = ''; return; }
    panel(); preview();
  }
  function labels() {
    $('#gpbtn').textContent = t('open');
    $$('#gpov [data-g2]').forEach(el => { el.textContent = t(el.dataset.g2); });
    $$('#gpov [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === which));
  }
  function init() {
    $('#gpbtn').onclick = () => { $('#menu').open = false; show(true); };
    $('#gpclose').onclick = () => show(false);
    $$('#gpov [data-v]').forEach(b => b.onclick = () => { which = b.dataset.v; labels(); preview(); });
    $('#gppdf').onclick = download;
    $('#gppanel').addEventListener('change', onField);
    window.addEventListener('resize', fit);
    $('#lang').addEventListener('change', () => { labels(); if ($('#gpov').classList.contains('open') && gp()) panel(); });
    labels();
  }
  window.S2B_GAMEPLAN = { show, preview };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
