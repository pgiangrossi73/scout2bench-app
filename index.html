<style>
:root { --navy: #16181d; --line: #d5d8de; --acc: #1f4fbf; --bg: #f4f5f7; }
* { box-sizing: border-box }
body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--navy); background: var(--bg) }
header { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5 }
header h1 { font: 700 22px/1 'Barlow Condensed', sans-serif; margin: 0 4px 0 0; white-space: nowrap }
header #model { min-width: 0; max-width: 260px; flex: 0 1 auto }
header #status { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
#menu { position: relative; margin-left: auto }
#menu summary { list-style: none; cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #b9bfca; border-radius: 8px; background: #fff; white-space: nowrap }
#menu summary::-webkit-details-marker { display: none }
#menu[open] summary { background: var(--navy); color: #fff }
#menu .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 280px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 10px; display: flex; flex-direction: column; gap: 6px }
#menu .pop button, #menu .pop input { width: 100%; text-align: left }
#menu .pop #delopp { color: #c62828; border-color: #e6b3b3 }
#menu .pop #delopp.arm { background: #c62828; color: #fff }
#menu .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100% }
header label { font-size: 13px; display: flex; gap: 6px; align-items: center }
select, input, button, textarea { font: inherit; font-size: 14px; min-height: 40px; border-radius: 8px; border: 1px solid #b9bfca; background: #fff; padding: 0 10px; color: var(--navy) }
button { cursor: pointer; font-weight: 600 }
button.on { background: var(--navy); color: #fff; border-color: var(--navy) }

<script id="src_dvw_tools" type="text/plain">#!/usr/bin/env python3
"""
dvw_tools.py - analisi DVW per il foglio panchina (STUDIO GARA, AEL Limassol).

Uso:
  python3 dvw_tools.py CARTELLA_DVW --team OLYMP --setter 11 --us AEL --weight 3 --out analisi.json

  --team    parte del nome della squadra avversaria (come in [3TEAMS])
  --setter  numero della palleggiatrice avversaria
  --us      parte del nome della nostra squadra: le gare contro di noi pesano --weight
  --weight  peso delle gare contro di noi (default 3)

Stampa un report testuale e salva tutti i numeri in un JSON.
Convenzioni (vedi procedura-foglio-panchina.md):
  rotazione = zona della palleggiatrice avversaria (1,6,5,4,3,2)
  ricezione: buona # +, media !, scarsa - /, ace =
  cambio palla (SO) per zona = solo battute in campo, gare vs noi pesate, zone avvicinate alla media (k=8)
"""
import sys, os, re, glob, json, math, argparse
from collections import Counter, defaultdict

SKILL_RE = re.compile(r'^([*a])(\d\d)([SREABDF])([HMQTUNO])([#+!\-/=])(.*)$')
POINT_RE = re.compile(r'^[*a]p\d\d:\d\d')
ROTS = [1, 6, 5, 4, 3, 2]
ROLE = {'1': 'L', '2': 'S', '3': 'O', '4': 'C', '5': 'P'}   # libero, banda, opposto, centrale, palleggio
K_SHRINK = 8

def read(path):
    raw = open(path, 'rb').read()
    try: return raw.decode('utf-8')
    except UnicodeDecodeError: return raw.decode('latin1')

def sections(txt):
    sec, cur = {}, None
    for line in txt.splitlines():
        if line.startswith('[3'): cur = line.strip(); sec[cur] = []
        elif cur: sec[cur].append(line)
    return sec

def parse_file(path, team_key, us_key, weight):
    sec = sections(read(path))
    t = sec['[3TEAMS]']
    hname, aname = t[0].split(';')[1], t[1].split(';')[1]
    home = team_key.upper() in hname.upper()
    if not home and team_key.upper() not in aname.upper():
        raise ValueError(f'{os.path.basename(path)}: squadra "{team_key}" non trovata ({hname} / {aname})')
    pref = '*' if home else 'a'
    opp = (aname if home else hname).strip()
    w = weight if us_key and us_key.upper() in opp.upper() else 1.0
    roster = {}
    for l in sec['[3PLAYERS-H]' if home else '[3PLAYERS-V]']:
        f = l.split(';')
        if len(f) >= 14 and f[1].strip().isdigit():
            roster[int(f[1])] = {'name': f[9].strip().title(), 'role': ROLE.get(f[13].strip(), '?')}
    rallies, cur = [], []
    for l in sec['[3SCOUT]']:
        f = l.split(';'); c = f[0]
        if not c: continue
        if POINT_RE.match(c):
            if cur: rallies.append({'touches': cur, 'winner': 'T' if c[0] == pref else 'O'})
            cur = []; continue
        m = SKILL_RE.match(c)
        if not m: continue
        team, num, sk, typ, ev, rest = m.groups()
        try:
            rot = int(f[9] if home else f[10]); orot = int(f[10] if home else f[9])
        except (ValueError, IndexError):
            rot = orot = None
        pos = [int(x) if x.strip().isdigit() else None for x in (f[14:20] if home else f[20:26])]
        cur.append(dict(team='T' if team == pref else 'O', num=int(num), skill=sk, type=typ, ev=ev, rest=rest,
                        set=int(f[8]) if len(f) > 8 and f[8].isdigit() else None, rot=rot, orot=orot, pos=pos))
    return dict(file=os.path.basename(path), opp=opp, w=w, roster=roster, rallies=rallies)

def zone(rest, i):
    return rest[i] if len(rest) > i and rest[i].isdigit() else None

def qual(ev):
    return 'pos' if ev in ('#', '+') else 'med' if ev == '!' else 'neg' if ev in ('-', '/', '=') else None

def pct(a, b): return round(100 * a / b) if b else 0

def shrink(v, n, base, k=K_SHRINK): return (v * n + base * k) / (n + k) if n + k else base

# ---------------- 1. alzate della palleggiatrice ----------------
def setter_sets(M, setter):
    out = []
    for m in M:
        for ri, r in enumerate(m['rallies']):
            T = r['touches']; n_in = 0
            for i, t in enumerate(T):
                if t['team'] != 'T' or t['skill'] != 'A': continue
                j = i - 1; prev = []
                while j >= 0 and T[j]['team'] == 'T' and T[j]['skill'] in 'EDRFB':
                    prev.insert(0, T[j]); j -= 1
                st = prev[-1] if prev and prev[-1]['skill'] == 'E' else None
                dump = t['num'] == setter and st is None
                if (st is None and not dump) or (st is not None and st['num'] != setter): continue
                first = prev[0] if prev and prev[0]['skill'] != 'E' else None
                phase = {'R': 'side', 'D': 'trans', 'B': 'trans', 'F': 'free'}.get(first['skill'], 'altro') if first else 'altro'
                pos = t['pos']; back = t['num'] in (pos[0], pos[4], pos[5])
                role = m['roster'].get(t['num'], {}).get('role', '?')
                dest = 'P' if dump else ('C' if role == 'C' else 'O' if role == 'O' else ('PIPE' if back else 'S') if role == 'S' else '?')
                n_in += 1
                out.append(dict(file=m['file'], w=m['w'], rally=ri, idx=i, set=t['set'], rot=t['rot'], phase=phase,
                                q=qual(first['ev']) if first else None, recv=first['num'] if first else None,
                                att=t['num'], name=m['roster'].get(t['num'], {}).get('name', '?'), dest=dest,
                                sz=zone(t['rest'], 3), ez=zone(t['rest'], 4), combo=t['rest'][:2], ev=t['ev'],
                                n_in=n_in, winner=r['winner'], back=back))
    return out

def setter_report(S, P):
    P('\n=== PALLEGGIATRICE: distribuzione per rotazione (cambio palla) ===')
    res = {}
    for rot in ROTS:
        res[rot] = {}
        for q in ('pos', 'med', 'neg'):
            rows = [x for x in S if x['rot'] == rot and x['phase'] == 'side' and x['q'] == q]
            c = Counter(f"#{x['att']} {x['name']}" for x in rows)
            res[rot][q] = {'n': len(rows), 'att': {k: pct(v, len(rows)) for k, v in c.most_common()}}
            P(f"P{rot} {q}: n={len(rows)} " + ', '.join(f'{k} {pct(v, len(rows))}' for k, v in c.most_common(4)))
        rows = [x for x in S if x['rot'] == rot and x['phase'] in ('trans', 'free')]
        c = Counter(f"#{x['att']} {x['name']}" for x in rows)
        res[rot]['trans'] = {'n': len(rows), 'att': {k: pct(v, len(rows)) for k, v in c.most_common()}}
        P(f"P{rot} trans: n={len(rows)} " + ', '.join(f'{k} {pct(v, len(rows))}' for k, v in c.most_common(4)))
        zs = Counter((x['att'], x['sz']) for x in S if x['rot'] == rot)
        P(f"   zone di partenza reali: " + ', '.join(f'#{a}@z{z}:{v}' for (a, z), v in zs.most_common(8)))
    P('\n=== Centrale per qualità ===')
    cen = {}
    for lab, f in [('ric buona', lambda x: x['phase'] == 'side' and x['q'] == 'pos'), ('ric media', lambda x: x['phase'] == 'side' and x['q'] == 'med'),
                   ('ric scarsa', lambda x: x['phase'] == 'side' and x['q'] == 'neg'), ('contrattacco', lambda x: x['phase'] == 'trans'), ('freeball', lambda x: x['phase'] == 'free')]:
        rows = [x for x in S if f(x)]; cen[lab] = pct(sum(x['dest'] == 'C' for x in rows), len(rows)); P(f'{lab}: {cen[lab]}% (n={len(rows)})')
    return {'by_rot': res, 'middle': cen}

def repetition_report(S, P):
    P('\n=== Ripetizioni (osservate vs attese per caso, stessa partita/rotazione/fase/qualità) ===')
    grp = lambda x: 'side' if x['phase'] == 'side' else 'trans'
    ctx = defaultdict(Counter)
    for x in S: ctx[(x['file'], x['rot'], grp(x), x['q'] if grp(x) == 'side' else 'all')][x['att']] += 1
    def base(x, a):
        c = ctx[(x['file'], x['rot'], grp(x), x['q'] if grp(x) == 'side' else 'all')].copy(); c[x['att']] -= 1
        n = sum(c.values()); return c[a] / n if n else None
    seqs = defaultdict(list)
    for x in S: seqs[(x['file'], x['set'])].append(x)
    G = defaultdict(lambda: [0, 0.0, 0.0, 0])
    for s in seqs.values():
        s.sort(key=lambda z: (z['rally'], z['idx']))
        for i in range(1, len(s)):
            pv, cu = s[i - 1], s[i]
            if pv['rally'] == cu['rally']: g = 'stessa azione'
            else:
                if any(z['rally'] == pv['rally'] and z['idx'] > pv['idx'] for z in s): continue
                g = 'dopo punto' if pv['ev'] == '#' else 'dopo errore/murata' if pv['ev'] in '=/' else 'dopo attacco in gioco'
            p = base(cu, pv['att'])

        P(f'{g}: n={n} ripete {pct(o, n)}% vs atteso {pct(e, n)}% (z={z:+.2f})')
    return out

# ---------------- 2. ricezione avversaria: dove battere ----------------
def reception(M):
    rows = []
    for m in M:
        for ri, r in enumerate(m['rallies']):
            T = r['touches']
            if not T or T[0]['skill'] != 'S' or T[0]['team'] != 'O': continue
            s = T[0]; rec = T[1] if len(T) > 1 and T[1]['team'] == 'T' and T[1]['skill'] == 'R' else None
            fa = None
            for t in T[2:]:
                if t['team'] == 'O': break
                if t['skill'] == 'A': fa = t; break
            rows.append(dict(file=m['file'], w=m['w'], set=s['set'], rot=s['rot'], orot=s['orot'], server=s['num'], stype=s['type'],
                             serr=s['ev'] == '=', ez=zone(s['rest'], 4), rnum=rec['num'] if rec else None,
                             rname=m['roster'].get(rec['num'], {}).get('name') if rec else None, rq=rec['ev'] if rec else None,
                             won=r['winner'] == 'T', fa=fa['ev'] if fa else None, lu=lineup_p1(rec or (T[2] if len(T) > 2 else None))))
    return rows

def lineup_p1(t):
    """ordine in campo z1..z6 riportato alla rotazione con la palleggiatrice in 1 (None se manca)"""
    if not t or t['team'] != 'T' or t['rot'] not in ROTS or None in t['pos']: return None
    L = list(t['pos'])
    for _ in range(ROTS.index(t['rot'])): L = L[-1:] + L[:-1]
    return tuple(L)

def lineup_ok(lu, pattern):
    """pattern = lista z1..z6 con '*' = posizione indifferente (es. le due centrali)"""
    if not pattern: return True
    return lu is not None and all(p == '*' or int(p) == n for p, n in zip(pattern, lu))

def agg(rows):
    W = sum(r['w'] for r in rows)
    if not W: return None
    f = lambda c: sum(r['w'] for r in rows if c(r)) / W
    fas = [r for r in rows if r['fa']]; FW = sum(r['w'] for r in fas)
    eff = (sum(r['w'] for r in fas if r['fa'] == '#') - sum(r['w'] for r in fas if r['fa'] in '=/')) / FW if FW else 0
    return dict(n=len(rows), W=W, pos=f(lambda r: r['rq'] in ('#', '+')), neg=f(lambda r: r['rq'] in ('-', '/', '=')), so=f(lambda r: r['won']), eff=eff)

def reception_report(R, P, lineup=None):
    P('\n=== RICEZIONE AVVERSARIA: cambio palla per rotazione e zona di battuta (battute in campo) ===')
    if lineup:
        ok = sum(lineup_ok(r['lu'], lineup) for r in R)
        P(f"Nomi delle ricevitrici solo dai set con ordine {','.join(lineup)} ({ok}/{len(R)} battute); cambio palla su tutti i set")
    inp = [r for r in R if not r['serr']]
    out = {}
    for rot in ROTS:
        rr = [r for r in inp if r['rot'] == rot]; b = agg(rr)
        if not b: continue
        P(f"\nP{rot}: n={b['n']} SO {b['so']:.0%} ric+ {b['pos']:.0%} ric- {b['neg']:.0%} primo attacco {b['eff']:.0%}")
        zs = {}
        for z in '165987':
            zr = [r for r in rr if r['ez'] == z]
            if not zr: continue
            a = agg(zr)
            who = Counter(r['rname'] for r in zr if r['rname'] and lineup_ok(r['lu'], lineup)).most_common(2)
            zs[z] = dict(n=a['n'], so=round(100 * shrink(a['so'], a['W'], b['so'])), pos=round(100 * shrink(a['pos'], a['W'], b['pos'])),
                         neg=round(100 * shrink(a['neg'], a['W'], b['neg'])), eff=round(100 * a['eff']), who=[w for w, _ in who], few=a['n'] < 5)
            P(f"  Z{z}: n={a['n']:2d} SO {zs[z]['so']}% ric+ {zs[z]['pos']}% ric- {zs[z]['neg']}% primo att {zs[z]['eff']}% | {who}{'  (pochi dati)' if a['n'] < 5 else ''}")
        rc = defaultdict(list)
        for r in rr:
            if r['rname'] and lineup_ok(r['lu'], lineup): rc[r['rname']].append(r)
        P('  ricevitrici: ' + ' | '.join(f"{k} n{len(v)} ric+{agg(v)['pos']:.0%} SO{agg(v)['so']:.0%}" for k, v in sorted(rc.items(), key=lambda z: -len(z[1]))))
        out[rot] = dict(so=round(100 * b['so']), pos=round(100 * b['pos']), zones=zs)
    return out

# ---------------- 3. battute avversarie ----------------
def serves(M):
    rows = []
    for m in M:
        for r in m['rallies']:
            T = r['touches']
            if not T or T[0]['skill'] != 'S' or T[0]['team'] != 'T': continue
            s = T[0]; rec = T[1] if len(T) > 1 and T[1]['skill'] == 'R' else None
            rows.append(dict(file=m['file'], w=m['w'], set=s['set'], rot=s['rot'], orot=s['orot'], num=s['num'],
                             name=m['roster'].get(s['num'], {}).get('name', '?'), type=s['type'], ev=s['ev'],
                             sz=zone(s['rest'], 3), ez=zone(s['rest'], 4), rq=rec['ev'] if rec else None, won=r['winner'] == 'T'))
    return rows

def serve_report(SV, P):
    P('\n=== BATTUTE AVVERSARIE: direzioni per battitrice ===')
    out = {}
    for (num, name), _ in Counter((s['num'], s['name']) for s in SV).most_common():
        rows = [s for s in SV if s['num'] == num]
        if len(rows) < 10: continue
        ends = Counter(s['ez'] for s in rows if s['ez']); ne = sum(ends.values())
        out[num] = dict(name=name, n=len(rows), start=Counter(s['sz'] for s in rows).most_common(1)[0][0],
                        types=dict(Counter(s['type'] for s in rows)), ends={k: pct(v, ne) for k, v in ends.most_common()},
                        ace=pct(sum(s['ev'] == '#' for s in rows), len(rows)), err=pct(sum(s['ev'] == '=' for s in rows), len(rows)),
                        bp=pct(sum(s['won'] for s in rows), len(rows)),
                        rot=Counter(s['rot'] for s in rows).most_common(1)[0][0])
        o = out[num]
        P(f"#{num} {name} (batte in P{o['rot']}) n={o['n']} da {o['start']} tipi {o['types']} | arrivo " +
          ', '.join(f'Z{k} {v}%' for k, v in list(o['ends'].items())[:5]) + f" | ace {o['ace']}% err {o['err']}% break {o['bp']}%")
    return out

# ---------------- 4. direzioni d'attacco ----------------
def attack_dirs(M):
    d = defaultdict(Counter); raw = Counter()
    for m in M:
        for r in m['rallies']:
            for t in r['touches']:
                if t['team'] == 'T' and t['skill'] == 'A':
                    sz, ez = zone(t['rest'], 3), zone(t['rest'], 4)
                    if ez:
                        k = (t['rot'], t['num'], sz); d[k][ez] += m['w']; raw[k] += 1
    return d, raw

def attack_report(D, RAW, P, top=3):
    P('\n=== DIREZIONI D\'ATTACCO (zona di arrivo nel nostro campo) per rotazione / attaccante / zona di partenza ===')
    out = defaultdict(list)
    for (rot, num, sz), c in sorted(D.items(), key=lambda kv: (ROTS.index(kv[0][0]) if kv[0][0] in ROTS else 9, -RAW[kv[0]])):
        if RAW[(rot, num, sz)] < 8: continue
        n = sum(c.values())
        z = [(k, pct(v, n)) for k, v in c.most_common(top)]
        out[rot].append(dict(num=num, start=sz, n=RAW[(rot, num, sz)], dests=z))
        P(f"P{rot} #{num} da z{sz} (n={RAW[(rot, num, sz)]}): " + ', '.join(f'Z{k} {v}%' for k, v in z))
    return out

# ---------------- 5. partenze per set ----------------
def starts(M, P):
    P('\n=== PARTENZE PER SET (rotazione alla prima battuta) ===')
    c = Counter(); out = []
    for m in M:
        seen = set()
        for r in m['rallies']:
            T = r['touches']
            if not T or T[0]['skill'] != 'S': continue
            s = T[0]
            if s['set'] in seen: continue
            seen.add(s['set']); who = 'batte' if s['team'] == 'T' else 'riceve'
            c[(s['rot'], who)] += 1; out.append(dict(opp=m['opp'], set=s['set'], rot=s['rot'], first=who))
    P(', '.join(f'P{r} {w}: {v}' for (r, w), v in c.most_common()))
    return out

def main():
    ap = argparse.ArgumentParser()
    ap.add_argument('folder'); ap.add_argument('--team', required=True); ap.add_argument('--setter', type=int, required=True)
    ap.add_argument('--us', default='AEL'); ap.add_argument('--weight', type=float, default=3.0); ap.add_argument('--out', default='analisi.json')
    ap.add_argument('--lineup', default=None, help='ordine z1..z6 con la palleggiatrice in 1, "*" = indifferente (es. "11,18,*,15,14,*"): '
                    'i nomi di chi riceve per zona vengono solo dai set con questo ordine')
    a = ap.parse_args()
    lineup = a.lineup.split(',') if a.lineup else None
    lines = []
    def P(*x): s = ' '.join(str(i) for i in x); print(s); lines.append(s)
    M = [parse_file(p, a.team, a.us, a.weight) for p in sorted(glob.glob(os.path.join(a.folder, '*.dvw')))]
    P(f'File: {len(M)} | gare pesate x{a.weight}: ' + ', '.join(m['opp'] for m in M if m['w'] > 1))
    S = setter_sets(M, a.setter); P(f'Alzate di #{a.setter} seguite da attacco: {len(S)}')
    res = dict(files=[dict(file=m['file'], opp=m['opp'], w=m['w']) for m in M],
               roster={m['file']: m['roster'] for m in M})
    res['setter'] = setter_report(S, P)
    res['repetitions'] = repetition_report(S, P)
    res['reception'] = reception_report(reception(M), P, lineup)
    res['serves'] = serve_report(serves(M), P)
    D, RAW = attack_dirs(M); res['attack_dirs'] = attack_report(D, RAW, P)
    res['starts'] = starts(M, P)
    json.dump(res, open(a.out, 'w'), ensure_ascii=False, indent=1, default=str)
    open(os.path.splitext(a.out)[0] + '_report.txt', 'w').write('\n'.join(lines))

if __name__ == '__main__':
    main()

"""
matchup_sim.py - rotazione di partenza consigliata contro un avversario.

Uso:
  python3 matchup_sim.py CARTELLA_DVW --team OLYMP --us AEL --weight 3 [--sets 20000]
         [--our-servers "1:3,6:6,5:9,4:1,3:27,2:13"] [--flat-so]

Modello (vedi procedura-foglio-panchina.md, punto 4.5):
  - quando battiamo noi: break della nostra battitrice (gare noi-loro nella cartella) x cambio palla della loro rotazione (tutte le gare, vs noi pesate)
  - quando battono loro: cambio palla della nostra rotazione (gare noi-loro) x break della loro battitrice (tutte le gare)
  - effetti additivi in scala logit, valori avvicinati alla media (K_THEM=15, K_US=10)
  - simula set a 25 per ogni combinazione: loro partenza x nostra partenza x chi batte per primo
Opzioni per una nostra formazione diversa da quella delle gare in cartella (es. infortuni):
  --our-servers  nostra battitrice per nostra rotazione (rotazione:numero). Battitrice senza dati = media squadra.
  --flat-so      il nostro cambio palla per rotazione non e' affidabile: si usa la media per tutte le rotazioni.
Richiede almeno una gara noi-loro nella cartella.
"""
import sys, os, glob, math, random, argparse
from collections import defaultdict, Counter
sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
from dvw_tools import parse_file, ROTS

def lg(p): p = min(max(p, 1e-3), 1 - 1e-3); return math.log(p / (1 - p))
def ex(x): return 1 / (1 + math.exp(-x))
def nxt(r): return ROTS[(ROTS.index(r) + 1) % 6]

def build(M, K_THEM=15, K_US=10, our_servers=None, flat_so=False):
    so = defaultdict(lambda: [0.0, 0.0]); bp = defaultdict(lambda: [0.0, 0.0]); srv_them = defaultdict(Counter)
    abp = defaultdict(lambda: [0, 0]); aso = defaultdict(lambda: [0, 0]); srv_us = defaultdict(Counter)
    for m in M:
        for r in m['rallies']:
            T = r['touches']
            if not T or T[0]['skill'] != 'S': continue
            s = T[0]; w = m['w']; them_won = r['winner'] == 'T'
            if s['team'] == 'O':          # serve the opponents of 'them' (in our games = us)
                so[s['rot']][0] += w; so[s['rot']][1] += w * them_won
                if m['w'] > 1:
                    abp[s['num']][0] += 1; abp[s['num']][1] += not them_won; srv_us[s['orot']][s['num']] += 1
            else:
                bp[s['num']][0] += w; bp[s['num']][1] += w * them_won; srv_them[s['rot']][s['num']] += w
                if m['w'] > 1:
                    aso[s['orot']][0] += 1; aso[s['orot']][1] += not them_won
    if not abp: raise SystemExit('Nessuna gara noi-loro trovata: servono per il modello.')
    tso = sum(v[1] for v in so.values()) / sum(v[0] for v in so.values())
    them_so = {r: (v[1] + K_THEM * tso) / (v[0] + K_THEM) for r, v in so.items()}
    tbp = sum(v[1] for v in bp.values()) / sum(v[0] for v in bp.values())
    them_bp = {k: (v[1] + K_THEM * tbp) / (v[0] + K_THEM) for k, v in bp.items()}
    abt = sum(v[1] for v in abp.values()) / sum(v[0] for v in abp.values())
    us_bp = {k: (v[1] + K_US * abt) / (v[0] + K_US) for k, v in abp.items()}
    ast = sum(v[1] for v in aso.values()) / sum(v[0] for v in aso.values())
    us_so = {k: (v[1] + K_US * ast) / (v[0] + K_US) for k, v in aso.items()}
    if flat_so: us_so = {r: ast for r in ROTS}
    SU = {r: c.most_common(1)[0][0] for r, c in srv_us.items()}
    if our_servers:
        SU = dict(our_servers)
        for k in SU.values(): us_bp.setdefault(k, abt)
    ST = {r: c.most_common(1)[0][0] for r, c in srv_them.items()}
    return dict(tso=tso, them_so=them_so, tbp=tbp, them_bp=them_bp, abt=abt, us_bp=us_bp, ast=ast, us_so=us_so, SU=SU, ST=ST,
                abp_raw={k: tuple(v) for k, v in abp.items()})

def sim(md, a0, o0, us_first, target=25, N=20000, seed=1):
    rng = random.Random(seed)
    def p_bp(a, o):   # we serve with our rotation a, they receive in o
        return ex(lg(md['abt']) + lg(md['us_bp'][md['SU'][a]]) - lg(md['abt']) + lg(1 - md['them_so'][o]) - lg(1 - md['tso']))
    def p_so(a, o):   # they serve with rotation o, we receive in a
        return ex(lg(md['ast']) + lg(md['us_so'][a]) - lg(md['ast']) - (lg(md['them_bp'][md['ST'][o]]) - lg(md['tbp'])))
    win = 0
    for _ in range(N):
        a, o, srv, pa, po = a0, o0, ('U' if us_first else 'T'), 0, 0
        while True:
            if srv == 'U':
                if rng.random() < p_bp(a, o): pa += 1
                else: po += 1; o = nxt(o); srv = 'T'
            else:
                if rng.random() < p_so(a, o): pa += 1; a = nxt(a); srv = 'U'
                else: po += 1
            if (pa >= target or po >= target) and abs(pa - po) >= 2: break
        win += pa > po
    return win / N

def main():
    ap = argparse.ArgumentParser()
    ap.add_argument('folder'); ap.add_argument('--team', required=True); ap.add_argument('--us', default='AEL')
    ap.add_argument('--weight', type=float, default=3.0); ap.add_argument('--sets', type=int, default=20000)
    ap.add_argument('--our-servers', default=None, help='es. "1:3,6:6,5:9,4:1,3:27,2:13"')
    ap.add_argument('--flat-so', action='store_true')
    a = ap.parse_args()
    osrv = {int(k): int(v) for k, v in (x.split(':') for x in a.our_servers.split(','))} if a.our_servers else None
    M = [parse_file(p, a.team, a.us, a.weight) for p in sorted(glob.glob(os.path.join(a.folder, '*.dvw')))]
    md = build(M, our_servers=osrv, flat_so=a.flat_so)
    print('Loro cambio palla per rotazione:', {r: round(v * 100) for r, v in sorted(md['them_so'].items())})
    print('Loro battitrice per rotazione:', md['ST'], '| nostra battitrice per nostra rotazione:', md['SU'])
    print('Nostro break per battitrice (grezzo: battute, vinte):', md['abp_raw'])
    print('Nostro break per battitrice (avvicinato alla media):', {k: round(v * 100) for k, v in md['us_bp'].items()})
    print('Nostro cambio palla per rotazione:', {k: round(v * 100) for k, v in sorted(md['us_so'].items())})
    for o0 in ROTS:
        for us_first in (True, False):
            res = sorted(((sim(md, a0, o0, us_first, N=a.sets), a0) for a0 in ROTS), reverse=True)
            print(f'Loro P{o0}, batte prima {"NOI" if us_first else "LORO"}: ' + ' | '.join(f'noi P{r}: {100*p:.1f}%' for p, r in res))

if __name__ == '__main__':
    main()
</script>
<script id="src_fase2" type="text/plain">"""
s2b_fase2.py - collegamento tra la pagina della fase 2 e gli script ORIGINALI (dvw_tools.py, matchup_sim.py).
s2b_fase2.py - glue between the phase-2 page and the ORIGINAL scripts (dvw_tools.py, matchup_sim.py).

Non cambia nessun calcolo: chiama le funzioni degli script così come sono. Aggiunge solo:
It changes no calculation: it calls the scripts' functions as they are. It only adds:
  - info(): data, squadre, set e rose di un DVW, per riconoscere i doppioni dal contenuto (come tools/prepara_dvw.py)
            date, teams, sets and rosters of a DVW, to detect duplicates by content (as tools/prepara_dvw.py)
  - analyse(): lo stesso lavoro di dvw_tools.main() su un elenco di file / the same work as dvw_tools.main() on a file list
  - matchup_*(): lo stesso modello di matchup_sim.main(), una combinazione alla volta (per mostrare l'avanzamento)
                 the same model as matchup_sim.main(), one combination at a time (to show progress)
"""
import json
import dvw_tools as T
import matchup_sim as MS

import re, datetime
def _nums(s):
    p = [int(x) for x in re.findall(r'\d+', s or '')[:3]]
    return p if len(p) == 3 else None

def _as(p, fmt):
    """p = tre numeri della data; fmt 'mdy' o 'dmy' -> datetime.date o None se non valida"""
    a, b, y = p
    m, d = (a, b) if fmt == 'mdy' else (b, a)
    try: return datetime.date(y if y > 100 else 2000 + y, m, d)
    except ValueError: return None

def _date(raw, head):
    """Gli scout scrivono la data come mm/gg/aaaa o gg/mm/aaaa. Si sceglie per tutto il file il formato coerente con
    GENERATOR-DAY e LASTCHANGE-DAY dell'intestazione (creazione <= ultima modifica, gara <= ultima modifica + 1 giorno).
    Scouts write mm/dd/yyyy or dd/mm/yyyy: pick, for the whole file, the format consistent with the header dates.
    Ritorna (data, ambigua) / returns (date, ambiguous)."""
    p = _nums(raw)
    if not p: return None, True
    gen = _nums(next((l.split(':', 1)[1] for l in head if l.startswith('GENERATOR-DAY')), ''))
    lch = _nums(next((l.split(':', 1)[1] for l in head if l.startswith('LASTCHANGE-DAY')), ''))
    ok = []
    for fmt in ('mdy', 'dmy'):
        d = _as(p, fmt)
        if not d: continue
        g = _as(gen, fmt) if gen else None; l = _as(lch, fmt) if lch else None
        if (gen and not g) or (lch and not l): continue
        if g and l and g > l: continue
        if l and d > l + datetime.timedelta(days=1): continue
        ok.append((abs((l - d).days) if l else 0, fmt, d))
    if not ok:   # nessun formato coerente: prima la regola di DataVolley (mm/gg) / none consistent: DataVolley default
        d = _as(p, 'mdy') or _as(p, 'dmy')
        return d, True
    ok.sort()
    amb = len(ok) == 2 and ok[0][2] != ok[1][2]
    return ok[0][2], amb

def info(path):
    sec = T.sections(T.read(path))
    if '[3TEAMS]' not in sec or '[3MATCH]' not in sec or '[3SCOUT]' not in sec:
        return None
    raw_date = sec['[3MATCH]'][0].split(';')[0].strip()
    teams = [x.split(';')[1].strip() for x in sec['[3TEAMS]'][:2]]
    sets = [s.split(';')[4].replace(' ', '') for s in sec.get('[3SET]', [])
            if s.startswith('True') and len(s.split(';')) > 4 and s.split(';')[4].strip()]
    rosters = []
    for key in ('[3PLAYERS-H]', '[3PLAYERS-V]'):
        r = []
        for l in sec.get(key, []):
            f = l.split(';')
            if len(f) >= 14 and f[1].strip().isdigit():
                r.append(dict(num=int(f[1]), name=f[9].strip().title(), role=T.ROLE.get(f[13].strip(), '?')))
        rosters.append(r)
    d, amb = _date(raw_date, sec.get('[3DATAVOLLEYSCOUT]', []))
    ymd = (d.year, d.month, d.day) if d else None
    # doppioni dal contenuto: data normalizzata, squadre, set / duplicates by content: normalised date, teams, sets
    return dict(sig=json.dumps([ymd or raw_date, teams[0], teams[1], sets]), date=raw_date, ymd=ymd, amb=amb,
                home=teams[0], away=teams[1], sets=sets, rosters=rosters)

def info_json(paths):
    out = []
    for p in paths:
        try:
            out.append(info(p))
        except Exception as e:
            out.append(dict(error=str(e)))
    return json.dumps(out, ensure_ascii=False)

def _load(paths, team, us, weight):
    return [T.parse_file(p, team, us, weight) for p in paths]

def analyse(paths, team, setter, us, weight, lineup=None):
    lines = []
    P = lambda *x: lines.append(' '.join(str(i) for i in x))
    lu = lineup.split(',') if lineup else None
    M = _load(paths, team, us, weight)
    P(f'File: {len(M)} | gare pesate x{weight}: ' + ', '.join(m['opp'] for m in M if m['w'] > 1))
    S = T.setter_sets(M, setter); P(f'Alzate di #{setter} seguite da attacco: {len(S)}')
    res = dict(files=[dict(file=m['file'], opp=m['opp'], w=m['w']) for m in M], roster={m['file']: m['roster'] for m in M})
    res['setter'] = T.setter_report(S, P)
    res['repetitions'] = T.repetition_report(S, P)
    res['reception'] = T.reception_report(T.reception(M), P, lu)
    res['serves'] = T.serve_report(T.serves(M), P)
    D, RAW = T.attack_dirs(M); res['attack_dirs'] = T.attack_report(D, RAW, P)
    res['starts'] = T.starts(M, P)
    res['text'] = '\n'.join(lines)
    return json.dumps(res, ensure_ascii=False, default=str)

_MD = {}
def matchup_build(paths, team, us, weight, our_servers=None, flat_so=False):
    """our_servers come in matchup_sim: "1:3,6:6,..." (rotazione:numero). Errore se non c'è nessuna gara contro di noi."""
    osrv = {int(k): int(v) for k, v in (x.split(':') for x in our_servers.split(','))} if our_servers else None
    M = _load(paths, team, us, weight)
    try:
        _MD['md'] = MS.build(M, our_servers=osrv, flat_so=flat_so)
    except SystemExit as e:
        raise ValueError(str(e))
    md = _MD['md']
    return json.dumps(dict(them_so={r: round(v * 100) for r, v in md['them_so'].items()}, ST=md['ST'], SU=md['SU'],
                           us_bp={k: round(v * 100) for k, v in md['us_bp'].items()}), default=str)

def matchup_sim(a0, o0, us_first, n):
    return MS.sim(_MD['md'], a0, o0, us_first, N=n)

# ---------- foglio precompilato / pre-filled sheet ----------
# Numeri: solo dagli script originali. Scelte (bersaglio, colori, frasi, mini-campi): PROPOSTE da controllare,
# con le regole di procedura-foglio-panchina.md (punti 4.2-4.4 e 5).
# Numbers: only from the original scripts. Choices (target, colours, texts, mini-courts): PROPOSALS to check.
from collections import Counter
STYPE = {'M': 'JF', 'Q': 'spin', 'H': 'float'}
GRID_ORDER = [0, 5, 4, 1, 2, 3]          # griglia z1 z6 z5 / z2 z3 z4 dalle posizioni P1..P6
SIDE = {'4': 'r', '3': 'c', '2': 'l', '9': 'l', '1': 'l', '8': 'c', '6': 'c', '7': 'r', '5': 'r'}
BACK = {'9': 'zero', '1': 'zero', '7': 'zero', '5': 'zero', '8': 'pipe', '6': 'pipe'}

def prefill(paths, team, setter, us, weight, lineup=None):
    lu = lineup.split(',') if lineup else None
    M = _load(paths, team, us, weight)
    P = lambda *x: None
    R = T.reception(M); rec = T.reception_report(R, P, lu)
    SV = T.serve_report(T.serves(M), P)
    D, RAW = T.attack_dirs(M); AD = T.attack_report(D, RAW, P)
    roster = {}
    for m in M:
        for k, v in m['roster'].items(): roster.setdefault(k, v)
    # formazione più frequente per rotazione / most frequent line-up per rotation
    # formazione per rotazione: per ogni posizione la giocatrice più frequente (se una giocatrice si ripete,
    # si torna alla formazione intera più frequente) / line-up per rotation: most frequent player per position
    # (if a player would appear twice, fall back to the most frequent whole line-up)
    lus = {r: Counter() for r in T.ROTS}; slot = {r: [Counter() for _ in range(6)] for r in T.ROTS}
    for m in M:
        for rl in m['rallies']:
            for t in rl['touches']:
                if t['team'] == 'T' and t['rot'] in lus and None not in t['pos']:
                    lus[t['rot']][tuple(t['pos'])] += 1
                    for i, n in enumerate(t['pos']): slot[t['rot']][i][n] += 1
    # partenze: la loro rotazione più frequente quando ricevono e quando battono / their most frequent start when receiving and when serving
    stl = T.starts(M, P)
    st_r = Counter(s['rot'] for s in stl if s['first'] == 'riceve'); st_b = Counter(s['rot'] for s in stl if s['first'] == 'batte')
    st = Counter(s['rot'] for s in stl)
    cols = {}
    for r in T.ROTS:
        x = rec.get(r)
        if not x: continue
        z = x['zones']
        # bersaglio e alternativa tra le zone 5, 6, 1 con dati sufficienti (come nei fogli approvati) / target and alternative among zones 5, 6, 1
        cand = sorted((v['so'], k) for k, v in z.items() if k in '561' and not v['few'])
        tgt = cand[0][1] if cand else None
        alt = cand[1][1] if len(cand) > 1 else None
        cls = {}
        for k in '561':
            if k not in z: continue
            if k == tgt: cls[k] = 'T'
            elif k == alt: cls[k] = 'A'
            elif z[k]['so'] >= x['so'] + 5: cls[k] = 'E'
        # chi riceve nella zona bersaglio (stesso filtro di --lineup) / who receives in the target zone
        who = Counter(q['rnum'] for q in R if q['rot'] == r and not q['serr'] and q['ez'] == tgt and q['rnum'] is not None and T.lineup_ok(q['lu'], lu))
        rn = who.most_common(1)[0][0] if who else None
        rnum = 'L' if rn is not None and roster.get(rn, {}).get('role') == 'L' else (str(rn) if rn is not None else '')
        # loro battuta: la battitrice che batte più spesso in questa rotazione / their server in this rotation
        sv = sorted(((o['n'], num, o) for num, o in SV.items() if o['rot'] == r), reverse=True)
        g0 = None
        if all(slot[r][i] for i in range(6)):
            pick = [slot[r][i].most_common(1)[0][0] for i in range(6)]
            g0 = pick if len(set(pick)) == 6 else list(lus[r].most_common(1)[0][0])
        # la battitrice è chi sta in zona 1 nella formazione scelta, se ha abbastanza battute / the server is the z1 player of the chosen line-up
        if g0 and g0[0] in SV: sv = [(SV[g0[0]]['n'], g0[0], SV[g0[0]])] + [x for x in sv if x[1] != g0[0]]
        their = None
        if sv:
            _, num, o = sv[0]
            typ = Counter(o['types']).most_common(1)[0][0]
            their = dict(num=num, name=o['name'], start=o['start'], type=STYPE.get(typ, typ), ends=list(o['ends'].items())[:3])
        minis = []
        for a in AD.get(r, [])[:3]:
            s = str(a['start'])
            minis.append(dict(num=a['num'], start=s, side=SIDE.get(s, 'c'), kind=BACK.get(s, ''), n=a['n'], dests=a['dests']))
        grid = [g0[i] for i in GRID_ORDER] if g0 else None
        cols[r] = dict(so={k: z[k]['so'] for k in '561' if k in z}, n={k: z[k]['n'] for k in '561' if k in z}, so_class=cls,
                       serve_target=tgt, serve_alt=alt, serve_num=rnum, their=their, minis=minis, grid=grid)
    top = lambda c: c.most_common(1)[0][0] if c else (st.most_common(1)[0][0] if st else None)
    return json.dumps(dict(cols=cols, start_rot=st.most_common(1)[0][0] if st else None, start_recv=top(st_r), start_serve=top(st_b),
                           files=[dict(file=m['file'], opp=m['opp'], w=m['w']) for m in M]), ensure_ascii=False, default=str)
</script>
<script id="src_serve_report" type="text/plain">#!/usr/bin/env python3
"""serve_report.py - receivers' serve report (coach multi-page PDF + one-page athletes sheet) from a JSON config.
Usage: 1) python3 serve_report.py DVW_DIR --build --team OLYMP --us AEL --weight 3 --match "Match 1 · 10 Nov 2026" --out draft.json
       2) edit the TO WRITE fields and the coach notes in draft.json
       3) python3 serve_report.py draft.json --out DIR
Config: see config_report_battuta_olympiada.json. Optional keys: card_pages [[num,...],...], vs_label, weight_note, depth_z1, athlete:false. Diagram: server at top, our court below (zone 5 left, zone 1 right)."""
import json, os, sys, glob, argparse, asyncio

NAVY = '#1d2a44'; RED = '#c8102e'; PINK = '#f2a7b5'; GREEN = '#1f8a70'; DROP = '#fde3c2'; GREY = '#5a6273'
DEPTH = {'high': (4.25, 'High', '4–4.5 m'), 'medium-high': (4.75, 'Medium-high', '4.5–5 m'),
         'intermediate-high': (4.75, 'Intermediate-high', '4.5–5 m'), 'intermediate': (5.25, 'Intermediate', '5–5.5 m'),
         'medium-deep': (5.75, 'Medium-deep', '5.5–6 m'), 'intermediate-deep': (5.75, 'Intermediate-deep', '5.5–6 m'),
         'deep': (6.25, 'Deep', '6–6.5 m')}
PRIO = {'HIGH': RED, 'MEDIUM': '#d97706', 'LOW': '#5a6273'}
# geometry (viewBox 140 x 190): opponent end line y=8, net y=58, our court y=58..178 (9 m), x 10..130
X0, W, NET, H = 10, 120, 58, 120
SX = {'1': .12, '9': .31, '6': .5, '7': .69, '5': .88}           # server start zones (server at top, facing down)
COL = {'4': 0, '7': 0, '5': 0, '3': 1, '8': 1, '6': 1, '2': 2, '9': 2, '1': 2}
ROW = {'4': 0, '3': 0, '2': 0, '7': 1, '8': 1, '9': 1, '5': 2, '6': 2, '1': 2}
_uid = [0]

def esc(t): return str(t).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

def court(sv, compact=False):
    _uid[0] += 1; u = f'k{_uid[0]}'
    s = [f'<svg viewBox="0 0 140 190" width="100%" role="img" aria-label="Serve directions of number {sv["num"]}">',
         f'<defs><marker id="{u}a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="{RED}"></path></marker></defs>']
    s.append(f'<rect x="{X0}" y="8" width="{W}" height="50" fill="#f6f7f9" stroke="#c9ced8"></rect>')
    # drop area = front + middle rows when short share is high
    cw, ch = W / 3, H / 3
    if sv.get('short', 0) >= 20:
        s.append(f'<rect x="{X0}" y="{NET + ch:.1f}" width="{W}" height="{ch:.1f}" fill="{DROP}"></rect>')
        s.append(f'<text x="{X0 + W - 3}" y="{NET + ch + 8:.1f}" text-anchor="end" font-size="7.5" fill="#b45309">drop {sv["short"]}%</text>')
    s.append(f'<rect x="{X0}" y="{NET}" width="{W}" height="{H}" fill="none" stroke="{NAVY}" stroke-width="1.4"></rect>')
    for i in (1, 2):
        s.append(f'<line x1="{X0 + i*cw:.1f}" y1="{NET}" x2="{X0 + i*cw:.1f}" y2="{NET + H}" stroke="#d5d8de" stroke-width=".6" stroke-dasharray="2 2"></line>')
        s.append(f'<line x1="{X0}" y1="{NET + i*ch:.1f}" x2="{X0 + W}" y2="{NET + i*ch:.1f}" stroke="#d5d8de" stroke-width=".6" stroke-dasharray="2 2"></line>')
    s.append(f'<line x1="4" y1="{NET}" x2="136" y2="{NET}" stroke="{NAVY}" stroke-width="3"></line>')
    for z in '432789561':
        s.append(f'<text x="{X0 + (COL[z] + .5) * cw:.1f}" y="{NET + (ROW[z] + .5) * ch + 3:.1f}" text-anchor="middle" font-size="9" fill="#b7bcc6">{z}</text>')
    # reception start line
    d = DEPTH[sv['depth']][0]
    y = NET + d / 9 * H
    s.append(f'<line x1="{X0}" y1="{y:.1f}" x2="{X0 + W}" y2="{y:.1f}" stroke="{GREEN}" stroke-width="2" stroke-dasharray="5 3"></line>')
    if sv.get('depth_z1'):
        y1 = NET + DEPTH[sv['depth_z1']][0] / 9 * H
        s.append(f'<line x1="{X0 + 2*cw:.1f}" y1="{y1:.1f}" x2="{X0 + W}" y2="{y1:.1f}" stroke="{GREEN}" stroke-width="2"></line>')
    # server + arrows
    sx = X0 + SX[sv['from']] * W; sy = 4
    targets = sv['targets']   # [[zone, pct], ...] sorted
    for i, (z, p) in enumerate(targets):
        tx = X0 + (COL[z] + .5) * cw; ty = NET + (ROW[z] + .5) * ch
        dash = '' if i == 0 else ' stroke-dasharray="4 3"'
        s.append(f'<line x1="{sx:.1f}" y1="{sy + 6}" x2="{tx:.1f}" y2="{ty - 9:.1f}" stroke="{RED}" stroke-width="{1 + p/14:.1f}"{dash} marker-end="url(#{u}a)" opacity="{1 if i == 0 else .85}"></line>')
    for z, p in targets:
        tx = X0 + (COL[z] + .5) * cw; ty = NET + (ROW[z] + .5) * ch
        s.append(f'<circle cx="{tx:.1f}" cy="{ty:.1f}" r="8.5" fill="#ffffff" stroke="{RED}" stroke-width="1.3"></circle><text x="{tx:.1f}" y="{ty + 3.2:.1f}" text-anchor="middle" font-size="8.5" font-weight="700" fill="{RED}">{p}</text>')
    s.append(f'<circle cx="{sx:.1f}" cy="{sy + 2}" r="7" fill="{NAVY}"></circle><text x="{sx:.1f}" y="{sy + 5}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#ffffff">{sv["num"]}</text>')
    s.append(f'<text x="70" y="187" text-anchor="middle" font-size="9" font-weight="700" fill="{NAVY}">US (reception)</text>')
    s.append('</svg>')
    return ''.join(s)

CSS = f'''
@page {{ size: A4; margin: 0 }}
* {{ box-sizing: border-box }}
body {{ margin: 0; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: {NAVY}; background: #fff }}
.page {{ width: 794px; height: 1123px; padding: 46px 52px 40px; display: flex; flex-direction: column; gap: 12px; page-break-after: always; position: relative; overflow: hidden }}
.page:last-child {{ page-break-after: auto }}
h1 {{ font: 700 30px/1.1 'Barlow Condensed', Arial Narrow, sans-serif; margin: 0 }}
h2 {{ font: 700 20px/1.1 'Barlow Condensed', Arial Narrow, sans-serif; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .4px }}
.sub {{ font-size: 12px; color: {GREY} }}
ul {{ margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.45 }}
table {{ border-collapse: collapse; width: 100%; font-size: 11.5px }}
th, td {{ border: 1px solid #c9ced8; padding: 4px 5px; text-align: left; vertical-align: top }}
th {{ background: {NAVY}; color: #fff; font-weight: 600 }}
td.n {{ text-align: right }}
.foot {{ position: absolute; bottom: 18px; left: 52px; right: 52px; font-size: 10px; color: {GREY}; text-align: center }}
.card {{ border: 1px solid #c9ced8; border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 190px 1fr; gap: 14px; flex: 0 0 auto }}
.kpis {{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 4px 0 6px }}
.kpi {{ background: #f1f3f6; border-radius: 4px; padding: 3px 5px; font-size: 10.5px; color: {GREY} }}
.kpi b {{ display: block; font-size: 15px; color: {NAVY} }}
.lab {{ font-weight: 700; font-size: 11.5px; margin-top: 5px }}
.txt {{ font-size: 12px; line-height: 1.38 }}
.pill {{ display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 700; color: #fff }}
'''
FONTS = '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">'

def card(sv, cfg):
    pr = sv['priority']
    k = sv['kpi']
    fin = sv.get('final')
    return f'''<div class="card">
<div>{court(sv)}</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font: 700 22px/1 'Barlow Condensed', sans-serif">No. {sv['num']} {esc(sv['name'])} <span style="font-size: 15px; color: {GREY}">· {esc(sv.get('style', 'jump float'))} from zone {sv['from']}</span></div>
<span class="pill" style="background: {PRIO[pr]}">{pr}</span></div>
<div class="kpis"><div class="kpi">Serves<b>{k['n']}</b></div><div class="kpi">Aces<b>{k['ace']}%</b></div><div class="kpi">Errors<b>{k['err']}%</b></div>
<div class="kpi">Our bad pass<b>{k['neg']}%</b></div><div class="kpi">Their break<b>{k['bp']}%</b></div></div>
<div class="lab">Targets</div><div class="txt">{esc(sv['targets_text'])}</div>
<div class="lab">Our reception starting depth</div><div class="txt">{DEPTH[sv['depth']][1]} ({DEPTH[sv['depth']][2]} from the net){(' · zone 1 ' + DEPTH[sv['depth_z1']][1].lower() + ' (' + DEPTH[sv['depth_z1']][2] + ')') if sv.get('depth_z1') else ''}</div>
{('<div class="lab">' + esc(cfg.get('vs_label', 'Against us')) + '</div><div class="txt">' + esc(fin) + '</div>') if fin else ''}
{('<div class="lab">Coach&#39;s notes</div><div class="txt" style="font-style: italic">“' + esc(sv['notes']) + '”</div>') if sv.get('notes') else ''}

# ---------------- BUILD: draft config straight from DVW files ----------------
def suggest_depth(frm, short):
    """Default starting depth from serve position and share of short serves. Coach observations override it."""
    if short >= 25: return 'intermediate-high'
    if frm == '5' and short < 15: return 'medium-deep'
    if frm == '1' and short >= 15: return 'intermediate'
    return 'intermediate'

def suggest_priority(n, bp, min_n=40, high_bp=40):
    if n < min_n: return 'LOW'
    return 'HIGH' if bp >= high_bp else 'MEDIUM'

def build_config(folder, team, us, weight=3.0, min_serves=10, match='', match_short=''):
    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import dvw_tools as D
    from collections import Counter, defaultdict
    files = sorted(glob.glob(os.path.join(folder, '*.dvw')))
    M = [D.parse_file(f, team, us, weight) for f in files]
    SV = D.serves(M)

    for r in SV: by[r['num']].append(r)
    names = {}
    for m in M: names.update({k: v['name'] for k, v in m['roster'].items()})
    def wp(rows, cond):
        W = sum(r['w'] for r in rows); return round(100 * sum(r['w'] for r in rows if cond(r)) / W) if W else 0
    servers = []

        if len(rows) < min_serves: continue
        frm = Counter(r['sz'] for r in rows if r['sz']).most_common(1)[0][0] if any(r['sz'] for r in rows) else '1'
        if frm not in SX: frm = '1'
        inr = [r for r in rows if r['ez'] and r['ev'] != '=']   # in-court serves only
        ends = Counter(); Wt = sum(r['w'] for r in inr)
        for r in inr: ends[r['ez']] += r['w']
        targets = [[z, round(100 * v / Wt)] for z, v in ends.most_common() if Wt and 100 * v / Wt >= 8][:4]
        short = wp(inr, lambda r: r['ez'] in '234789') if inr else 0
        rec = [r for r in rows if r['rq']]
        k = dict(n=len(rows), ace=wp(rows, lambda r: r['ev'] == '#'), err=wp(rows, lambda r: r['ev'] == '='),
                 neg=wp(rec, lambda r: r['rq'] in ('-', '/', '=')) if rec else 0, bp=wp(rows, lambda r: r['won']))
        styles = Counter(r['type'] for r in rows)
        style = {'Q': 'jump spin', 'M': 'jump float', 'H': 'float'}.get(styles.most_common(1)[0][0], 'serve')
        vs = [r for r in rows if us and any(us.upper() in m['opp'].upper() and m['file'] == r['file'] for m in M)]
        final = None
        if vs:
            ez = Counter(r['ez'] for r in vs if r['ez']).most_common(2)
            final = (f"{len(vs)} serves: {sum(r['ev'] == '#' for r in vs)} aces, {sum(r['ev'] == '=' for r in vs)} errors; "
                     f"we sided out {sum(not r['won'] for r in vs)}/{len(vs)}. " +
                     ', '.join(f'zone {z} {c} times' for z, c in ez) + '.')
        main_t = ' and '.join(f'zone {z}' for z, _ in targets[:2])
        depth = suggest_depth(frm, short)
        servers.append(dict(num=num, name=names.get(num, '?'), **{'from': frm}, style=style,
            style_short={'jump spin': 'JS', 'jump float': 'JF', 'float': 'F'}.get(style, 'S'),
            priority=suggest_priority(len(rows), k['bp']), depth=depth, kpi=k, short=short, targets=targets,
            main=main_t, targets_text=', '.join(f'zone {z} ({p}%)' for z, p in targets) + f'. Short serves: {short}%.',
            final=final, notes=None,
            instructions=[f"Main target: {main_t}.", f"Start {DEPTH[depth][1].lower()} ({DEPTH[depth][2]} from the net)."] +
                         ([f"{short}% of her serves land short: front passers step in early."] if short >= 20 else []) +
                         ([f"Many errors ({k['err']}%): let long balls go and call them."] if k['err'] >= 15 else []),
            cues=[f"Targets: {main_t}"] + (["Short serves: step in early"] if short >= 20 else []) +
                 (["Many errors: let long balls go"] if k['err'] >= 15 else []),
            athlete=len(rows) >= 20))
    return dict(id=f'{team}_serve_analysis', title=f'{team}: serve analysis', subtitle=f'{match} | Source: {len(files)} Data Volley files | Internal use',
        source_short=f'{len(files)} Data Volley files ({len(SV)} serves)', footer=f'{team} – serve analysis',
        summary=['TO WRITE: key messages for the passers (main patterns, threats, subs).'],
        rule='TO WRITE: one-line rule for the reception starting depth.',
        training=['TO WRITE'], data_notes=[f"Source: {len(files)} Data Volley files. Serve counts are unweighted; percentages weight matches vs {us} ×{weight:g}.",
        'Starting depths and priorities are suggested by the script (short-serve share, break %): confirm with the coach.'],
        athlete_title=f'{team.upper()} – THEIR SERVERS', athlete_sub=match_short, vs_label=f'Against {us}', weight_note=f'Matches vs {us} weighted ×{weight:g}.', cards_per_page=2, servers=servers)

def main():
    ap = argparse.ArgumentParser(); ap.add_argument('config', help='config JSON (render) or DVW folder (--build)'); ap.add_argument('--out', default='.')
    ap.add_argument('--build', action='store_true', help='create a draft config from a DVW folder'); ap.add_argument('--team'); ap.add_argument('--us', default='AEL')
    ap.add_argument('--weight', type=float, default=3.0); ap.add_argument('--match', default=''); ap.add_argument('--match-short', default='')
    a = ap.parse_args()
    if a.build:
        cfg = build_config(a.config, a.team, a.us, a.weight, match=a.match, match_short=a.match_short)
        json.dump(cfg, open(a.out, 'w'), ensure_ascii=False, indent=1); print('draft config ->', a.out); return
    cfg = json.load(open(a.config)); os.makedirs(a.out, exist_ok=True)
    base = os.path.join(a.out, cfg['id'])
    open(base + '_coach.html', 'w').write(coach_html(cfg)); open(base + '_athletes.html', 'w').write(athlete_html(cfg))
    asyncio.run(to_pdf(base + '_coach.html', base + '_coach.pdf', base + '_coach.png'))
    asyncio.run(to_pdf(base + '_athletes.html', base + '_athletes.pdf', base + '_athletes.png'))

if __name__ == '__main__':

"""

  their_lineup_p1: numeri avversari z1..z6 con la palleggiatrice in z1 -> nelle traiettorie entrano solo le attaccanti
    in prima linea in quella rotazione (altrimenti si mescolano formazioni diverse)
  attack_show: {"1": [12, 7, 10]} forza le attaccanti di una rotazione (anche di seconda linea, es. pipe);
    senza questa voce entrano le attaccanti di prima linea tranne la palleggiatrice
  attack_side: {"1": {"12": "l", "7": "r"}} lato da cui attacca nel disegno: "r" = loro posto 4, "l" = loro posto 2
  matchup: {"them": 2, "us": 6, "we_serve_first": true}  -> accoppiamento rotazioni per la riga NOI
  block_rule: soglie del segnale di muro (vedi BLOCK_RULE)
  block_override: {"4": {"signal": "4", "text": "...", "text_en": "..."}} = scelta dell'allenatore per rotazione, prevale sulla regola
  key_points: fino a 3 frasi per il foglio atlete (vuote = caselle da scrivere a mano)
  quick_x: posizione di partenza delle veloci sul nostro campo (0 sinistra = loro zona 2, 1 destra = loro zona 4)

Regole (dichiarate anche sul foglio):
  CP = cambio palla dell'avversaria sulle nostre battute in campo, gare vs noi pesate (procedura foglio panchina).
  Distribuzione alzata: attacchi dopo ricezione # o +; centro = centrale (qualsiasi veloce) + pipe; bande e opposto per zona di partenza reale (lato 2 = z2/z9/z1, lato 4 = z4/z7/z5).
  Segnale di muro (regola di Lino, 15/11/2026):
    PUGNO (segui il centrale) se centrale >= mid_share e efficienza centrale >= mid_eff,
      oppure se centrale >= cover_mid_min e centrale + lato verso cui va la veloce >= cover
      e quel lato riceve davvero palla (>= side_min);
    altrimenti 4 se lato 4 >= side4, 2 se lato 2 >= side2, se no LEGGERE.
  Strategia di battuta: CORTA se il bersaglio e' una zona corta (2,3,4,7,8,9); MIRATA se la ricevitrice bersaglio
    fa CP almeno 8 punti sotto la rotazione (n >= 8); SPINGI se la rotazione fa CP >= 58%; altrimenti IN CAMPO.

def match_date(path):

    home = team_key.upper() in t[0].split(';')[1].upper()

    for l in sec['[3SCOUT]']:

        msh = wsum(ss, lambda x: x['dest'] == 'C') / tw
        qs = Counter()
        for x in mids: qs[QUICK_SIDE.get(x['combo'], 4)] += x['w']
        qside = qs.most_common(1)[0][0] if qs else 4
        same = dist[qside] if qside in dist else 0
        if (msh >= rule['mid_share'] and d['mid_eff'] >= rule['mid_eff']) or (msh >= rule['cover_mid_min'] and msh + same >= rule['cover'] and same >= rule['side_min']):
            sig = 'PUGNO'; why = f'segui il centrale (centrale {round(100*msh)}% + lato {qside} {round(100*same)}%)'
        elif dist[4] >= rule['side4']: sig = '4'; why = f'lato 4 {round(100*dist[4])}%'
        elif dist[2] >= rule['side2']: sig = '2'; why = f'lato 2 {round(100*dist[2])}%'
        else: sig = 'LEGGERE'; why = 'distribuzione aperta'
        d['signal'], d['signal_why'], d['mid_share'] = sig, why, msh
        ov = cfg.get('block_override', {}).get(str(rot))
        if ov:   # scelta dell'allenatore: prevale sulla regola
            d['signal_data'] = sig; d['signal'] = ov['signal']; d['signal_text'] = ov.get('text'); d['signal_text_en'] = ov.get('text_en')
            d['signal_why'] = 'scelta allenatore (dati: ' + sig + ')'
        # attaccanti principali (tutte le fasi)
        aa = [x for x in att if x['rot'] == rot]
        show = cfg.get('attack_show', {}).get(str(rot))
        fr = front_row(cfg['their_lineup_p1'], rot) if cfg.get('their_lineup_p1') else None
        keep = set(show) if show else {n for n in (fr or {x['num'] for x in aa}) if roster.get(n, {}).get('role') != 'P'}
        d['front_row'] = fr
        aa = [x for x in aa if x['num'] in keep]; aw = wsum(aa) or 1
        top = Counter()
        for x in aa: top[x['num']] += x['w']
        tops = []
        for num, v in top.most_common(3):
            xs = [x for x in aa if x['num'] == num]
            sd = Counter(side_of(x['sz']) for x in xs).most_common(1)[0][0]
            ends = Counter(); [ends.__setitem__(x['ez'], ends[x['ez']] + x['w']) for x in xs if x['ez']]
            ew2 = sum(ends.values()) or 1
            ez, ev = ends.most_common(1)[0] if ends else (None, 0)
            sz = Counter(x['sz'] for x in xs).most_common(1)[0][0]
            cmb = Counter(x['combo'] for x in xs).most_common(1)[0][0]
            rl = roster.get(num, {}).get('role')
            sd2 = cfg.get('attack_side', {}).get(str(rot), {}).get(str(num)) or ('mid' if rl == 'C' else ('r' if sd == 4 else 'l'))
            dests = [dict(z=k, p=round(100 * vv / ew2), dir=direction(sd2, k, rl)) for k, vv in ends.most_common(2)]
            tops.append(dict(num=num, role=roster.get(num, {}).get('role', '?'), name=roster.get(num, {}).get('name', '?'),
                             share=round(100 * v / aw), sz=sz, ez=ez, ezp=round(100 * ev / ew2), combo=cmb, n=len(xs),
                             dests=dests, spread=round(100 * ev / ew2) < 40, side=sd2,
                             dir=direction(sd2, ez, rl)))
        d['attack'] = tops; d['attack_n'] = len(aa)
        # loro battuta
        sv = [s for s in SV if s['rot'] == rot]
        if sv:
            num = Counter(s['num'] for s in sv).most_common(1)[0][0]; xs = [s for s in sv if s['num'] == num]
            ends = Counter(s['ez'] for s in xs if s['ez']); ne = sum(ends.values()) or 1
            ty = Counter(s['type'] for s in xs).most_common(1)[0][0]
            d['their_serve'] = dict(num=num, name=roster.get(num, {}).get('name', '?'), type={'Q': 'spin', 'M': 'float', 'H': 'float'}.get(ty, ty),
                                    start=Counter(s['sz'] for s in xs).most_common(1)[0][0],
                                    ends=[(k, pct(v, ne)) for k, v in ends.most_common(3)],
                                    bp=pct(wsum(sv, lambda s: s['won']), wsum(sv)), n=len(sv),
                                    err=pct(sum(s['ev'] == '=' for s in xs), len(xs)), ace=pct(sum(s['ev'] == '#' for s in xs), len(xs)))
        # battuta nostra: dal foglio panchina
        bc = bcols.get(rot)
        if bc:
            d['grid'] = bc['grid']; d['players'] = bc['players']; d['setter_pos'] = bc['setter']
            d['target'], d['alt'] = bc['serve_target'], bc.get('serve_alt')
            m_ = re.search(r'·\s*([^·]+?)\s*$', bc['serve_text'])
            rec = m_.group(1) if m_ else None; d['receiver'] = rec
            libs = {k for k, v in roster.items() if v['role'] == 'L'}
            if rec and (rec == 'L' or rec.strip('#').isdigit()):
                who = (lambda r: r['rnum'] in libs) if rec == 'L' else (lambda r, n=int(rec.strip('#')): r['rnum'] == n)
                xr = [r for r in rr if who(r)]; ar = T.agg(xr)
                d['rec_cp'] = round(100 * ar['so']) if ar else None; d['rec_n'] = len(xr)
            zr = [r for r in rr if r['ez'] == str(d['target'])]
            az = T.agg(zr) if zr else None
            d['tgt_cp'] = round(100 * az['so']) if az else None; d['tgt_n'] = len(zr)
            gap = (d['cp'] - d['rec_cp']) if d.get('rec_cp') is not None and d['cp'] is not None else 0
            d['strategy'] = ('CORTA' if str(d['target']) in '234789'
                             else 'MIRATA' if gap >= 8 and d.get('rec_n', 0) >= 8
                             else 'SPINGI' if (d['cp'] or 0) >= 58 else 'IN CAMPO')
        out[rot] = d
    return out, S, att, roster

def direction(side, ez, role):
    """side = lato da cui attacca nel disegno: 'r' (loro posto 4), 'l' (loro posto 2), 'mid' (centrale)"""
    if not ez: return '–'
    if ez in ('2', '3', '4'): return 'corta'
    if role == 'C' or side == 'mid': return 'centro' if ez in ('6', '8') else f'verso z{ez}'
    if ez in ('6', '8'): return 'centro'
    end = 'l' if ez in ('5', '7', '4') else 'r'
    return 'lungolinea' if end == side else 'diagonale'

def pairing(cfg):
    """per ogni loro rotazione in ricezione: nostra rotazione al servizio (stessa catena del match-up)"""
    mu = cfg.get('matchup')
    if not mu: return {}
    nxt = lambda r: ROTS[(ROTS.index(r) + 1) % 6]
    o, a = mu['them'], mu['us']
    if not mu.get('we_serve_first', True): o = nxt(o)          # loro battono, noi riceviamo e poi andiamo al servizio
    if not mu.get('we_serve_first', True): a = nxt(a)
    res = {}
    for _ in range(6):
        res[o] = a; o, a = nxt(o), nxt(a)
    return res

def front_row(lineup_p1, rot):
    """numeri in prima linea (z4, z3, z2) nella rotazione rot"""
    L = our_rotation(lineup_p1, rot)
    return [L[3], L[2], L[1]]

def our_rotation(lineup_p1, rot):
    """lineup z1..z6 nella nostra rotazione rot (rot = zona della palleggiatrice)"""
    k = ROTS.index(rot); L = list(lineup_p1)
    for _ in range(k): L = L[1:] + L[:1]
    return L

def reliability(n, matches):
    return 'alta' if matches >= 6 and n >= 20 else 'media' if matches >= 3 and n >= 10 else 'bassa'

def court_reception(d, w=176, h=150, small=False):
    """campo di ricezione come il foglio panchina: rete in basso, zone 1/9/2 a sinistra, bersaglio in trasparenza"""
    X0, Y0, CW, CH = 1, 1, w - 2, h - 6
    s = [f'<svg width="{w}" height="{h}" viewBox="0 0 {w} {h}" role="img" aria-label="Schieramento in ricezione e zona di battuta">',
         f'<rect x="{X0}" y="{Y0}" width="{CW}" height="{CH}" fill="{SOFT}" stroke="{INK}" style="stroke-width: 1.2px"></rect>']
    VIEW = [['1', '6', '5'], ['9', '8', '7'], ['2', '3', '4']]
    for ri, row in enumerate(VIEW):
        for ci, z in enumerate(row):
            if z in (d.get('target'), d.get('alt')):
                op = .30 if z == d.get('target') else .12
                s.append(f'<rect x="{X0+ci*CW/3:.1f}" y="{Y0+ri*CH/3:.1f}" width="{CW/3:.1f}" height="{CH/3:.1f}" fill="{TGT}" style="fill-opacity: {op}"></rect>')
                s.append(f'<text x="{X0+ci*CW/3+CW/6:.1f}" y="{Y0+ri*CH/3+13:.1f}" fill="{TGT}" style="font-size: {10 if small else 11}px; font-weight: 800; text-anchor: middle">{"ZONA " if not small else "Z"}{z}</text>')
    for i in (1, 2):
        s.append(f'<line x1="{X0+i*CW/3:.1f}" y1="{Y0}" x2="{X0+i*CW/3:.1f}" y2="{Y0+CH}" stroke="{LINE}" style="stroke-width: 1px; stroke-dasharray: 3 3"></line>')
        s.append(f'<line x1="{X0}" y1="{Y0+i*CH/3:.1f}" x2="{X0+CW}" y2="{Y0+i*CH/3:.1f}" stroke="{LINE}" style="stroke-width: 1px; stroke-dasharray: 3 3"></line>')
    s.append(f'<line x1="0" y1="{Y0+CH}" x2="{w}" y2="{Y0+CH}" stroke="{INK}" style="stroke-width: 3px"></line>')
    rec = d.get('receiver')
    for nn, x, y, kind in d.get('players', []):
        cx, cy = X0 + x * CW, Y0 + y * CH; back = kind in ('B', 'R')
        is_t = rec and (nn == rec.strip('#'))
        r = 11 if small else 13
        fill = TGT if is_t else ('#d9dce2' if back else '#ffffff'); tc = '#ffffff' if is_t else INK
        s.append(f'<circle cx="{cx:.1f}" cy="{cy:.1f}" r="{r}" fill="{fill}" stroke="{INK}" style="stroke-width: {2.4 if back else 1.2}px"></circle>'
                 f'<text x="{cx:.1f}" y="{cy+4.5:.1f}" fill="{tc}" style="font-size: {11 if small else 13}px; font-weight: {800 if back else 600}; text-anchor: middle">{esc(nn)}</text>')
    if d.get('setter_pos'):
        sx, sy = X0 + d['setter_pos'][0] * CW, Y0 + d['setter_pos'][1] * CH
        s.append(f'<path d="M{sx:.1f} {sy-8:.1f} L{sx+7:.1f} {sy+6:.1f} L{sx-7:.1f} {sy+6:.1f} Z" fill="#d62828"></path>')
    s.append('</svg>')
    return ''.join(s)

ZX = {'4': 0, '7': 0, '5': 0, '3': 1, '8': 1, '6': 1, '2': 2, '9': 2, '1': 2}
ZY = {'4': 0, '3': 0, '2': 0, '7': 1, '8': 1, '9': 1, '5': 2, '6': 2, '1': 2}

def start_x(a, cfg):
    qx = dict(QUICK_X, **cfg.get('quick_x', {}))
    if a['role'] == 'C': return qx.get(a['combo'], .5)
    s = side_of(a['sz'])
    return .15 if s == 2 else .85 if s == 4 else .5

def start_positions(attacks, cfg):
    """x di partenza (0-1) di ogni attaccante: per lato, distanziati per non sovrapporre le etichette"""
    qx = dict(QUICK_X, **cfg.get('quick_x', {}))
    base = {'l': .14, 'r': .86}
    groups = defaultdict(list)
    for i, a in enumerate(attacks):
        groups[a.get('side') or ('mid' if a['role'] == 'C' else 'r')].append(i)
    xs = {}
    for k, idx in groups.items():
        if k == 'mid':
            for j, i in enumerate(idx): xs[i] = min(max(qx.get(attacks[i]['combo'], .5) + j * .1, .08), .92)
            continue
        b = base.get(k, .5); n = len(idx); step = .16 * (-1 if k == 'r' else 1)
        for j, i in enumerate(idx): xs[i] = min(max(b + j * step, .08), .92)
    return xs

            ang = math.atan2(y2 - y1, x2 - x1); ah = 8 if k == 0 else 6; wd = 4 if k == 0 else 3

            if k == 0:   # % solo sulla zona principale: le altre stanno nella riga di testo

    s += labels

def table(rows, head=None, small=False):
    fs = 11.5 if small else 12
    h = ''.join(f'<th style="text-align: left; padding: 2px 4px; color: {MUTED}; font-weight: 600; border-bottom: 1px solid {INK}">{esc(x)}</th>' for x in head) if head else ''
    b = ''.join('<tr>' + ''.join(f'<td style="padding: 2px 4px; border-bottom: 1px solid {LINE}">{x}</td>' for x in r) + '</tr>' for r in rows)
    return f'<table style="border-collapse: collapse; font-size: {fs}px; width: 100%">{"<thead><tr>" + h + "</tr></thead>" if h else ""}<tbody>{b}</tbody></table>'

def study_page(cfg, allm, win, R, S, att, roster, info):
    # identikit
    aw = Counter(); ak = Counter(); an = Counter(); rc = Counter(); rp = Counter()
    for x in att:
        aw[x['num']] += x['w']; an[x['num']] += 1; ak[x['num']] += x['w'] * (x['ev'] == '#')
    for r in T.reception(win):
        if r['rnum']: rc[r['rnum']] += 1; rp[r['rnum']] += r['rq'] in ('#', '+')
    tot = sum(aw.values()) or 1
    order = {'P': 0, 'O': 1, 'S': 2, 'C': 3, 'L': 4}
    ids = [n for n in roster if an[n] >= 10 or rc[n] >= 15 or n == cfg['setter']]
    ids.sort(key=lambda n: (order.get(roster[n]['role'], 5), -aw[n]))
    role_full = {'P': 'palleggio', 'O': 'opposto', 'S': 'banda', 'C': 'centrale', 'L': 'libero'}
    idk = table([[f'<b>#{n}</b>', esc(roster[n]['name']), role_full.get(roster[n]['role'], '?'),
                  f'{round(100*aw[n]/tot)}%' if an[n] else '–', f'{pct(ak[n], aw[n])}%' if an[n] else '–',
                  f'{rc[n]}·{pct(rp[n], rc[n])}%' if rc[n] else '–'] for n in ids],
                ['N°', 'Giocatrice', 'Ruolo', 'att.', 'punto', 'ric. n·+#'], small=True)
    # partenze (tutta la stagione)
    st = []
    for m in allm:
        seen = set()
        for r in m['rallies']:
            t = r['touches']
            if not t or t[0]['skill'] != 'S' or t[0]['set'] in seen: continue
            seen.add(t[0]['set']); st.append((m, t[0]['set'], t[0]['rot'], 'batte' if t[0]['team'] == 'T' else 'riceve'))
    cnt = Counter((x[2], x[3]) for x in st)
    part = table([[f'P{r}', w, str(v), f'{pct(v, len(st))}%'] for (r, w), v in cnt.most_common(6)], ['Partenza', 'primo scambio', 'set', '%'])
    part += f'<div style="font-size: 12px; color: {MUTED}">{len(st)} set in {len(allm)} partite (tutta la stagione caricata)</div>'
    # palla calda: da 20 in su, distacco <= 2
    hot = Counter(); hn = 0
    for m in win:
        for ri, r in enumerate(m['rallies']):
            if ri >= len(m['scores']): break
            a, b = m['scores'][ri]
            if max(a, b) >= 20 and abs(a - b) <= 2:
                for t in r['touches']:
                    if t['team'] == 'T' and t['skill'] == 'A': hot[t['num']] += m['w']; hn += 1
    ht = sum(hot.values()) or 1
    cfg['_hot_auto'] = 'from 20 points, close score: ' + ' · '.join(f'#{n} {roster.get(n, {}).get("name", "")} {round(100*v/ht)}%' for n, v in hot.most_common(3))
    hotrows = [[f'<b>#{n}</b> {esc(roster.get(n, {}).get("name", "?"))}', f'{round(100*v/ht)}%', f'{round(100*aw[n]/tot)}%'] for n, v in hot.most_common(4)]
    rep = T.repetition_report(S, lambda *a: None).get('dopo punto')
    calda = table(hotrows, ['Attaccante', 'da 20 pari ±2', 'in generale'], small=True)
    calda += f'<div style="font-size: 12px; color: {MUTED}">n {hn} attacchi.' + (f' Dopo un punto ripete la stessa attaccante {rep["obs"]}% vs {rep["exp"]}% atteso (z {rep["z"]:+.1f}).' if rep else '') + '</div>'
    # rendimento per rotazione
    rend = table([[f'<b>P{r}</b>', f'{R[r]["cp"]}%', str(R[r]['cp_n']), f'{R[r]["their_serve"]["bp"]}%' if R[r].get('their_serve') else '–',
                   str(R[r]['their_serve']['n']) if R[r].get('their_serve') else '–', reliability(R[r]['cp_n'], R[r]['cp_matches'])] for r in ROTS],
                 ['Rot.', 'CP', 'n', 'BP', 'n', 'affid.'])
    # chiamate del centrale
    mq = []
    for lab, f in (('ricez. +/#', lambda x: x['phase'] == 'side' and x['q'] == 'pos'), ('ricez. !', lambda x: x['phase'] == 'side' and x['q'] == 'med'),
                   ('ricez. –', lambda x: x['phase'] == 'side' and x['q'] == 'neg'), ('contrattacco', lambda x: x['phase'] == 'trans'), ('freeball', lambda x: x['phase'] == 'free')):
        rows = [x for x in S if f(x)]; mids = [x for x in rows if x['dest'] == 'C']
        c = Counter(kname(x['combo']) for x in mids)
        mq.append([lab, f'{pct(len(mids), len(rows))}%', str(len(rows)), ' · '.join(f'{k} {v}' for k, v in c.most_common(3))])
    chiam = table(mq, ['Situazione', 'centrale', 'n', 'chiamate (n)'])
    # tendenze
    tend = []
    for r in ROTS:
        d = R[r]
        if d.get('rec_cp') is not None and d.get('rec_n', 0) >= 8 and d['cp'] - d['rec_cp'] >= 8:
            tend.append(((d['cp'] - d['rec_cp']) * math.sqrt(d['rec_n']), f'P{r}: con la battuta su {d["receiver"]} il CP scende a {d["rec_cp"]}% (rotazione {d["cp"]}%, n {d["rec_n"]})'))
        top = d['attack'][0] if d['attack'] else None
        if top and top['share'] >= 35:
            tend.append((top['share'] * math.sqrt(top['n']) / 5, f'P{r}: #{top["num"]} prende il {top["share"]}% degli attacchi ({top["dir"]} {top["ezp"]}%, n {top["n"]})'))
        ts = d.get('their_serve')
        if ts and ts['err'] >= 20: tend.append((ts['err'] * 1.5, f'P{r}: #{ts["num"]} batte {ts["type"]} e sbaglia il {ts["err"]}% delle battute'))
    cr = {lab: v for lab, v, *_ in mq}
    try:
        g, b = int(cr['ricez. +/#'][:-1]), int(cr['ricez. –'][:-1])
        if g - b >= 15: tend.append(((g - b) * 2, f'Centrale: {g}% con ricezione +/#, {b}% con ricezione scarsa → su ricezione –, muro a 2 sulle bande'))
    except (KeyError, ValueError): pass
    if rep and rep['z'] >= 2: tend.append((rep['z'] * 15, f'Dopo un punto ripete la stessa attaccante più del caso ({rep["obs"]}% vs {rep["exp"]}%)'))
    tend.sort(key=lambda x: -x[0])
    trows = ''.join(f'<div style="font-size: 12px; line-height: 1.35"><b>{i + 1}.</b> {esc(t)}</div>' for i, (_, t) in enumerate(tend[:5]))
    # partite usate
    used = table([[m['date'].strftime('%d/%m') if m['date'] else '?', esc(m['opp']), f'×{m["w"]:g}', 'sì' if m in win else 'solo partenze'] for m in allm],
                 ['Data', 'Contro', 'peso', 'finestra'], small=True)
    notes = ''.join(f'<div style="border-bottom: 1px solid {LINE}; height: 22px"></div>' for _ in range(6))
    body = f'''<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">{box('Identikit', idk)}{box('Partite usate', used)}</div>
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">{box('Partenze del loro allenatore', part)}{box('Palla calda', calda)}{box('Rendimento per rotazione', rend)}</div>
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">{box('Chiamate del centrale', chiam)}{box('5 tendenze più forti', trows)}{box('Appunti video', notes, 'flex: 1')}</div>
</div>
<div style="font-size: 12px; color: {MUTED}">Affidabilità (regola Setter Radar): alta ≥ 6 partite e ≥ 20 casi per rotazione · media ≥ 3 e ≥ 10 · altrimenti bassa. Gare contro AEL pesate ×{cfg.get('weight', 3):g}.</div>'''
    return f'<div style="{PAGE}">{header(cfg, "Studio e sessione video", 3, info)}{body}</div>'

def render(path, pdf, png=None, pages=1):
    import asyncio
    from playwright.async_api import async_playwright
    async def run():
        async with async_playwright() as p:
            b = await p.chromium.launch()
            pg = await b.new_page(viewport={'width': PW, 'height': PH}, device_scale_factor=2)
            await pg.goto('file://' + os.path.abspath(path)); await pg.wait_for_timeout(800)
            over = await pg.evaluate('''() => [...document.body.children].map((e, i) => [i + 1, e.scrollHeight, e.clientHeight, e.scrollWidth, e.clientWidth]).filter(x => x[1] > x[2] + 1 || x[3] > x[4] + 1)''')
            for i, sh, ch, sw, cw in over: print(f'ATTENZIONE: pagina {i} trabocca ({sw}x{sh} invece di {cw}x{ch})')
            await pg.pdf(path=pdf, width='297mm', height='210mm', print_background=True, margin={'top': '0', 'bottom': '0', 'left': '0', 'right': '0'})
            if png:
                h = await pg.evaluate('document.body.scrollHeight')
                await pg.set_viewport_size({'width': PW, 'height': h}); await pg.screenshot(path=png, full_page=True)
            await b.close()
    asyncio.run(run())

def main():

    ap.add_argument('config'); ap.add_argument('--out', default='.'); ap.add_argument('--png', action='store_true')
    ap.add_argument('--lang', choices=['it', 'en'], default='it', help='lingua delle pagine staff (il foglio atlete e\' sempre in inglese)')
    a = ap.parse_args()
    cfg = json.load(open(a.config))
    base = os.path.dirname(os.path.abspath(a.config))
    for k in ('dvw_folder', 'bench_config'):
        if cfg.get(k) and not os.path.isabs(cfg[k]): cfg[k] = os.path.join(base, cfg[k])
    bench = json.load(open(cfg['bench_config'])) if cfg.get('bench_config') else None
    allm, win, md = load(cfg)
    if not win: raise SystemExit('Nessuna partita nella finestra')
    d0, d1 = min(m['date'] for m in win), max(m['date'] for m in win)
    info = f'{len(win)} partite · {cfg.get("window_days", 45)} giorni · {d0:%d/%m}–{d1:%d/%m}'
    R, S, att, roster = rotation_data(win, cfg, bench)
    names = {str(k): v for k, v in cfg.get('our_names', {}).items()}
    os.makedirs(a.out, exist_ok=True); stem = os.path.join(a.out, cfg.get('id', 'game_plan'))
    if a.lang == 'en': cfg = dict(cfg, match_label=cfg.get('match_label_en', cfg['match_label']))
    pages = staff_pages(cfg, R, info, names) + [study_page(cfg, allm, win, R, S, att, roster, info)]
    staff = html(pages)
    if a.lang == 'en': staff = to_en(staff); stem_s = stem + '_staff_en'
    else: stem_s = stem + '_staff'
    open(stem_s + '.html', 'w').write(staff)
    open(stem + '_atlete.html', 'w').write(html([athletes_page(cfg, R, info)], 'en'))
    json.dump({str(k): {kk: vv for kk, vv in v.items() if kk not in ('players',)} for k, v in R.items()}, open(stem + '_dati.json', 'w'), ensure_ascii=False, indent=1, default=str)
    render(stem_s + '.html', stem_s + '.pdf', stem_s + '.png' if a.png else None)
    render(stem + '_atlete.html', stem + '_atlete.pdf', stem + '_atlete.png' if a.png else None)
    print('scritto', stem_s + '.pdf', stem + '_atlete.pdf')
    for r in ROTS:
        d = R[r]; print(f"P{r}: CP {d['cp']}% n{d['cp_n']} | dist {({k: round(100*v) for k, v in d['dist'].items()})} n{d['dist_n']} | {d['signal']} ({d['signal_why']}) | battuta {d.get('strategy')} z{d.get('target')} {d.get('receiver')} CP {d.get('rec_cp')} n{d.get('rec_n')}")

if __name__ == '__main__':
    main()

s2b_fase3.py - glue between the app and the ORIGINAL phase-3 scripts (serve_report.py, then game_plan.py).
Nessun calcolo nuovo: si chiamano le funzioni degli script così come sono. / No new calculation: the scripts' own functions.

import os, json, shutil
import serve_report as SR

def _folder(paths, name):
    """build_config() legge una cartella: si copia lì solo la selezione di gare / build_config() reads a folder: copy the selection there"""
    d = '/tmp/' + name
    shutil.rmtree(d, ignore_errors=True); os.makedirs(d)
    for i, p in enumerate(paths):
        shutil.copy(p, os.path.join(d, f'{i:03d}.dvw'))
    return d

def serve_build(paths, team, us, weight, match='', match_short=''):
    return json.dumps(SR.build_config(_folder(paths, 'sr'), team, us, weight, match=match, match_short=match_short), ensure_ascii=False, default=str)

def serve_render(cfg_json, which):
    cfg = json.loads(cfg_json)
    return SR.coach_html(cfg) if which == 'coach' else SR.athlete_html(cfg)

def serve_depths():
    return json.dumps({k: [v[1], v[2]] for k, v in SR.DEPTH.items()}, ensure_ascii=False)

# ---------------- game plan ----------------
import re
import game_plan as GP

def _named_folder(files, name):
    """file con il loro nome originale: game_plan.py usa include/exclude sui nomi / original names: game_plan.py matches include/exclude on names"""
    d = '/tmp/' + name
    shutil.rmtree(d, ignore_errors=True); os.makedirs(d)
    for path, fname in files:
        # stessi nomi dei DVW di STUDIO GARA: senza ( ) &, spazi -> _ (include/exclude dei config approvati)
        # same names as STUDIO GARA's DVW: no ( ) &, spaces -> _ (include/exclude in the approved configs)
        n = re.sub(r'\s', '_', re.sub(r'[()&]', '', re.sub(r'[\\/]', '-', fname)).strip())
        if not n.lower().endswith('.dvw'): n += '.dvw'
        shutil.copy(path, os.path.join(d, n))
    return d

def gp_render(cfg_json, files_json, bench_json, lang='it', which='staff'):
    """stesso lavoro di game_plan.main() senza file e senza PDF: restituisce l'HTML / same work as main() without files or PDF"""
    cfg = json.loads(cfg_json)
    cfg['dvw_folder'] = _named_folder(json.loads(files_json), 'gp')
    bench = json.loads(bench_json) if bench_json else None
    allm, win, md = GP.load(cfg)
    if not win: raise ValueError('Nessuna partita nella finestra / no match in the window')
    d0, d1 = min(m['date'] for m in win), max(m['date'] for m in win)
    info = f'{len(win)} partite · {cfg.get("window_days", 45)} giorni · {d0:%d/%m}–{d1:%d/%m}'
    R, S, att, roster = GP.rotation_data(win, cfg, bench)
    if which == 'athletes':
        GP.study_page(cfg, allm, win, R, S, att, roster, info)   # calcola la palla calda (_hot_auto), come in main() / computes the hot ball as main() does
        return GP.html([GP.athletes_page(cfg, R, info)], 'en')
    names = {str(k): v for k, v in cfg.get('our_names', {}).items()}
    if lang == 'en': cfg = dict(cfg, match_label=cfg.get('match_label_en', cfg['match_label']))
    pages = GP.staff_pages(cfg, R, info, names) + [GP.study_page(cfg, allm, win, R, S, att, roster, info)]
    staff = GP.html(pages)
    return GP.to_en(staff) if lang == 'en' else staff

  // ---------- pannello delle proprietà / inspector ----------
